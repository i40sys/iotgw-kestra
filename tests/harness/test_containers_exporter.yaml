---
# Harness test: containers_exporter (Prometheus exporter of the Docker
# containers, scraped by Alloy). Publishes container :8118 on
# 127.0.0.1:${PORT} (containers_exporter_port).
- name: containers_exporter stack on an OpenWrt container
  hosts: openwrt
  remote_user: root
  gather_facts: false
  vars:
    containers_exporter: true
    containers_exporter_port: 9118
  roles:
    - gekmihesg.openwrt
  tasks:
    - ansible.builtin.import_tasks: tests/harness/prep_docker.yaml
    - ansible.builtin.import_tasks: tasks/containers_exporter.yaml
    - ansible.builtin.import_tasks: tasks/containers_exporter.yaml
    # A run that failed half-way leaves the stack files without .env, which
    # compose cannot load (not even to tear down): the next run must recover.
    - name: "harness: leave the stack directory without its .env"
      ansible.builtin.raw: rm /opt/stacks/containers_exporter/.env
      changed_when: false
    - ansible.builtin.import_tasks: tasks/containers_exporter.yaml

    - name: "check: the container runs the pinned image"
      ansible.builtin.raw: >-
        docker image inspect -f '{{ "{{" }}join .RepoDigests " "{{ "}}" }}'
        $(docker inspect -f '{{ "{{" }}.Image{{ "}}" }}' containers_exporter-srv-1)
      register: img
      changed_when: false
      failed_when: (lookup('file', 'files/stacks/containers_exporter/compose.yaml') | regex_search('@(sha256:[0-9a-f]{64})', '\\1') | first) not in img.stdout

    - name: "check: the exporter container stays running"
      ansible.builtin.raw: sleep 10; docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }} {{ "{{" }}.RestartCount{{ "}}" }}' containers_exporter-srv-1
      register: cstate
      changed_when: false
      failed_when: cstate.stdout | trim != "true 0"

    - name: "check: /metrics answers on 127.0.0.1:9118 with Prometheus text"
      ansible.builtin.raw: curl -fsS http://127.0.0.1:9118/metrics
      register: metrics
      retries: 20
      delay: 3
      until: metrics.rc == 0 and '# HELP' in metrics.stdout
      changed_when: false
