---
# Shared by the docker-stack tests: bring the target to where the `system`
# stack leaves a gateway for them. Packages: the subset of
# files/lists/packages.lst these stacks use (the full list is ~350 packages).
# Then the REAL tasks/system_docker.yaml (dockerd config + compose plugin).
- name: "prep: packages the system stack provides"
  ansible.builtin.raw: >-
    opkg update >/dev/null &&
    opkg install bash curl docker dockerd shadow-usermod shadow-groupmod
    python3-requests python3-urllib python3-logging python3-email >/dev/null
  changed_when: false

- ansible.builtin.import_tasks: tasks/system_docker.yaml

- name: "check: dockerd runs with the system stack's daemon.json (no reboot needed)"
  ansible.builtin.raw: docker info --format '{{ "{{" }} .DockerRootDir {{ "}}" }}' | grep -qx /opt/docker
  changed_when: false

- name: "harness: dockerd pid before re-running the system stack's docker part"
  ansible.builtin.raw: pidof dockerd
  register: dockerd_pid_before
  changed_when: false

# A second pass with the config unchanged must NOT restart dockerd (that would
# stop every container on each re-provisioning).
- ansible.builtin.import_tasks: tasks/system_docker.yaml

- name: "check: an unchanged config does not restart dockerd"
  ansible.builtin.raw: pidof dockerd
  register: dockerd_pid_after
  changed_when: false
  failed_when: dockerd_pid_after.stdout | trim != dockerd_pid_before.stdout | trim
