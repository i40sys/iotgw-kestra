---
- name: "mosquitto: Check if Docker stack is running"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/mosquitto
    state: present
  register: stack_status
  ignore_errors: true

- name: "mosquitto: Teardown the Docker stack if running"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/mosquitto
    state: absent
  when: stack_status is not failed

- name: "mosquitto: Remove directory /opt/stacks/mosquitto"
  ansible.builtin.file:
    path: /opt/stacks/mosquitto
    state: absent

- name: "mosquitto: clonning repos"
  ansible.builtin.git:
    repo: 'git@github.com:example-org/iotgw_mosquitto.git'
    dest: /opt/stacks/mosquitto
    accept_hostkey: true
    key_file: /root/.ssh/id_rsa


- name: "mosquitto: adding GIT pre-push hook"
  ansible.builtin.copy:
    src: pre-push
    dest: /opt/stacks/mosquitto/.git/hooks/pre-push
    owner: root
    group: root
    mode: '0755'


- name: "mosquitto: Installing usermod for changing root password"
  community.general.opkg:
    name: "{{ item }}"
    state: present
  loop:
    - shadow-usermod
    - shadow-groupmod


- name: "mosquitto: Create mosquitto group with GID 1883"
  ansible.builtin.group:
    name: mosquitto
    gid: 1883
    system: yes
    state: present


- name: "mosquitto: Create mosquitto user"
  ansible.builtin.user:
    name: mosquitto
    uid: 1883
    system: yes
    create_home: no
    home: /var/empty
    shell: /sbin/nologin
    group: mosquitto
    comment: "mosquitto"


- name: "mosquitto: creating required directories"
  ansible.builtin.file:
    path: "/opt/stacks/mosquitto/{{ item }}"
    state: directory
    owner: mosquitto
    group: mosquitto
    mode: '0755'
  loop:
    - etc
    - data

- name: "mosquitto: Fetch mosquitto.conf.j2"
  ansible.builtin.fetch:
    src: /opt/stacks/mosquitto/etc/mosquitto.conf.j2
    dest: /tmp/mosquitto.conf.j2
    flat: yes

- name: "mosquitto: Template mosquitto.conf.j2"
  ansible.builtin.template:
    src: /tmp/mosquitto.conf.j2
    dest: /opt/stacks/mosquitto/etc/mosquitto.conf
    owner: mosquitto
    group: mosquitto
    mode: '0640'

