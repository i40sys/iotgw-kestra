- name: "mosquitto: /opt/stacks/mosquitto/etc/mqtt_users is present"
  ansible.builtin.file:
    path: /opt/stacks/mosquitto/etc/mqtt_users
    state: touch
    owner: mosquitto
    group: mosquitto
    mode: '0640'
  

- name: "mosquitto: add MQTT user using mosquitto_passwd in Docker"
  community.docker.docker_container:
    name: mosquitto_temp
    image: eclipse-mosquitto:2.0
    command: >
      /usr/bin/mosquitto_passwd 
        -b /mosquitto/config/mqtt_users 
        {{ item.username }} 
        {{ item.password }}
    network_mode: host
    volumes:
      - /opt/stacks/mosquitto/etc:/mosquitto/config
    auto_remove: true
    state: started
  loop: "{{ users }}"
  when: users is defined and users | length > 0

# Task to check if user {{ iiot_mqtt_user }} exists in EMQX authentication database
- name: "mosquitto: Check if user {{ iiot_mqtt_user }} exists in EMQX"
  uri:
    #url: "{{ emqx_api_url }}/authentication/password_based%3Abuilt_in_database/users?limit=100&page=1"
    url: "{{ emqx_api_url }}/authentication/password_based%3Abuilt_in_database/users?limit=20&page=1"
    method: GET
    headers:
      Authorization: "Basic {{ (emqx_api_key + ':' + emqx_api_secret) | b64encode }}"
      #Authorization: "Basic REDACTED_BASIC_AUTH"
      Content-Type: "application/json"
    return_content: yes
  register: user_list
  failed_when: user_list.status != 200

# - ansible.builtin.debug:
#     var: user_list

# Task to create the user if it does not exist
- name: "mosquitto: Create user {{ iiot_mqtt_user }} if not exists"
  uri:
    url: "{{ emqx_api_url }}/authentication/password_based%3Abuilt_in_database/users"
    method: POST
    headers:
      Authorization: "Basic {{ (emqx_api_key + ':' + emqx_api_secret) | b64encode }}"
      Content-Type: "application/json"
    body_format: json
    body:
      user_id: "{{ iiot_mqtt_user }}"
      password: "{{ iiot_mqtt_password }}"
      is_superuser: true
    status_code: 201
  when: iiot_mqtt_user not in user_list.json.data | map(attribute='user_id')

# Task to update the password if the user already exists
- name: "mosquitto: Update password for user {{ iiot_mqtt_user }}"
  uri:
    url: "{{ emqx_api_url }}/authentication/password_based%3Abuilt_in_database/users/{{ iiot_mqtt_user }}"
    method: PUT
    headers:
      Authorization: "Basic {{ (emqx_api_key + ':' + emqx_api_secret) | b64encode }}"
      Content-Type: "application/json"
    body_format: json
    body:
      password: "{{ iiot_mqtt_password }}"
      is_superuser: true
    status_code: 200
  when: iiot_mqtt_user in user_list.json.data | map(attribute='user_id')

- name: "mosquitto: Start Docker stack"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/mosquitto
    state: present
  register: output

- name: "mosquitto: Display stack startup logs"
  ansible.builtin.debug:
    var: output
