# Re-provisioning tears the existing stack down before its directory is
# replaced; a fresh gateway has none. Look for its compose file (every name
# `docker compose` accepts, so a stack an older revision deployed is found too)
# instead of running compose on a missing directory, which logged a red, ignored
# `fatal: ... is not a directory` on every first install (and `state: present`
# started an existing stack just to tear it down).
- name: "netxms: Look for an existing Docker stack"
  ansible.builtin.stat:
    path: "/opt/stacks/netxms/{{ item }}"
  loop: [compose.yaml, compose.yml, docker-compose.yaml, docker-compose.yml]
  register: stack_files

- name: "netxms: Teardown the existing Docker stack"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/netxms
    state: absent
  when: stack_files.results | selectattr('stat.exists') | list | length > 0

- name: "netxms: Remove directory /opt/stacks/netxms"
  ansible.builtin.file:
    path: /opt/stacks/netxms
    state: absent

- name: 'netxms: deploy stack files (task-073 §7: vendored in files/stacks/, no git clone)'
  ansible.builtin.copy:
    src: stacks/netxms/
    dest: /opt/stacks/netxms/
    mode: preserve
- name: "netxms: Fetch env.j2 template"
  ansible.builtin.fetch:
    src: /opt/stacks/netxms/env.j2
    dest: /tmp/netxms_env.j2
    flat: yes
  ignore_errors: true

- name: "netxms: Template environment file"
  ansible.builtin.template:
    src: /tmp/netxms_env.j2
    dest: /opt/stacks/netxms/.env
    owner: root
    group: root
    mode: '0640'
  when: ansible_failed_result is not defined

- name: "netxms: Set proper ownership and permissions"
  ansible.builtin.file:
    path: /opt/stacks/netxms
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "netxms: Start Docker stack"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/netxms
    state: present
  register: output

- name: "netxms: Display stack startup logs"
  ansible.builtin.debug:
    var: output
