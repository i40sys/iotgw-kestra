---
- name: "telegraf: Check if Docker stack is running"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/telegraf
    state: present
  register: stack_status
  ignore_errors: true

- name: "telegraf: Teardown the Docker stack if running"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/telegraf
    state: absent
  when: stack_status is not failed

- name: "telegraf: Remove directory /opt/stacks/telegraf"
  ansible.builtin.file:
    path: /opt/stacks/telegraf
    state: absent

- name: "telegraf: clonning repos"
  ansible.builtin.git:
    repo: 'git@github.com:example-org/iotgw_telegraf.git'
    dest: /opt/stacks/telegraf
    accept_hostkey: true
    key_file: /root/.ssh/id_rsa

- name: "telegraf: adding GIT pre-push hook"
  ansible.builtin.copy:
    src: pre-push
    dest: /opt/stacks/telegraf/.git/hooks/pre-push
    owner: root
    group: root
    mode: '0755'
  

- name: "telegraf: Fetch env.j2"
  ansible.builtin.fetch:
    src: /opt/stacks/telegraf/env.j2
    dest: /tmp/env.j2
    flat: yes

- name: "telegraf: Template env.j2"
  ansible.builtin.template:
    src: /tmp/env.j2
    dest: /opt/stacks/telegraf/.env
    owner: root
    group: root
    mode: '0640'

- name: "telegraf: Start Docker stack"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/telegraf
    state: present
    recreate: always
  register: output

- name: "telegraf: Display stack startup logs"
  ansible.builtin.debug:
    var: output
