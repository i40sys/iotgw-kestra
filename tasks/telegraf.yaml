# Re-provisioning tears the existing stack down before its directory is
# replaced; a fresh gateway has none. Look for its compose file (every name
# `docker compose` accepts, so a stack an older revision deployed is found too)
# instead of running compose on a missing directory, which logged a red, ignored
# `fatal: ... is not a directory` on every first install (and `state: present`
# started an existing stack just to tear it down).
- name: "telegraf: Look for an existing Docker stack"
  ansible.builtin.stat:
    path: "/opt/stacks/telegraf/{{ item }}"
  loop: [compose.yaml, compose.yml, docker-compose.yaml, docker-compose.yml, .env]
  register: stack_files

- name: "telegraf: Teardown the existing Docker stack"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/telegraf
    state: absent
  vars:
    found: "{{ stack_files.results | selectattr('stat.exists') | map(attribute='item') | list }}"
  # Also needs .env: compose will not load this project without it (not even
  # to tear it down), and it is written just before the stack starts, so a
  # directory without it (a run that failed half-way) has no stack running.
  when: found | reject('eq', '.env') | list | length > 0 and '.env' in found

- name: "telegraf: Remove directory /opt/stacks/telegraf"
  ansible.builtin.file:
    path: /opt/stacks/telegraf
    state: absent

- name: 'telegraf: deploy stack files (task-073 §7: vendored in files/stacks/, no git clone)'
  ansible.builtin.copy:
    src: stacks/telegraf/
    dest: /opt/stacks/telegraf/
    mode: preserve
- name: "telegraf: Fetch env.j2"
  ansible.builtin.fetch:
    src: /opt/stacks/telegraf/env.j2
    dest: /tmp/env.j2
    flat: yes

- name: "telegraf: Template env.j2"
  ansible.builtin.template:
    src: /tmp/env.j2
    dest: /opt/stacks/telegraf/.env
    owner: root
    group: root
    mode: '0640'
  no_log: true  # renders secrets (task-130)

- name: "telegraf: Start Docker stack"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/telegraf
    state: present
    recreate: always
  register: output

- name: "telegraf: Display stack startup logs"
  ansible.builtin.debug:
    var: output
