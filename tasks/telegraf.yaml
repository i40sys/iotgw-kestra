- name: "telegraf: Check if Docker stack is running"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/telegraf
    state: present
  register: stack_status
  ignore_errors: true

- name: "telegraf: Teardown the Docker stack if running"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/telegraf
    state: absent
  when: stack_status is not failed

- name: "telegraf: Remove directory /opt/stacks/telegraf"
  ansible.builtin.file:
    path: /opt/stacks/telegraf
    state: absent

- name: 'telegraf: deploy stack files (task-073 §7: vendored in files/stacks/, no git clone)'
  ansible.builtin.copy:
    src: stacks/telegraf/
    dest: /opt/stacks/telegraf/
    mode: preserve
- name: "telegraf: Fetch env.j2"
  ansible.builtin.fetch:
    src: /opt/stacks/telegraf/env.j2
    dest: /tmp/env.j2
    flat: yes

- name: "telegraf: Template env.j2"
  ansible.builtin.template:
    src: /tmp/env.j2
    dest: /opt/stacks/telegraf/.env
    owner: root
    group: root
    mode: '0640'

- name: "telegraf: Start Docker stack"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/telegraf
    state: present
    recreate: always
  register: output

- name: "telegraf: Display stack startup logs"
  ansible.builtin.debug:
    var: output
