---
# tasks/ssh_ca.yaml — SSH-CA enrollment / renewal of a gateway through its iotgw
# agent (task-089, reworked for iotgw-ng decision-033 / task-132.06).
#
# The gateway's `iotgw ssh refresh` does the whole transaction: ensure the
# ecdsa-P256 host key (the private half never leaves), call the `ssh-ca` edge
# function, install host cert + User CA + auth_principals + RevokedKeys + the
# 50-/60- sshd drop-ins, `sshd -t`, reload (never a plain restart), and restore
# every file if sshd does not serve them. This task only decides HOW it is
# authenticated (decision-033 §5):
#
#   * already enrolled (a host certificate is installed) → RENEW: signed with
#     the enrolled host key, no one-time code at all;
#   * not enrolled yet → FIRST ENROLLMENT: needs a one-time code. The gateway
#     cannot compute one (its seed lives only in the KMS), so the controller asks
#     the iotgw-ui backend for the current code (POST /internal/devices/
#     enroll-code, bearer OPS_CERT_MINT_TOKEN — the runner's existing backend
#     credential) and hands it to `iotgw ssh refresh -otp` for this one call.
#     A device the server already has enrolled (e.g. reinstalled) is refused
#     (409): use "Reset SSH enrollment" in the UI first.
#
# No TOTP is derived anywhere any more (decision-009 is superseded).
#
# Vars (from the Kestra flow / extra-vars):
#   device_uuid        the device's uuid (json_data) — selects the code
#   iotgw_backend_url  default http://iotgw-ui-backend.iotgw-ui.svc.cluster.local:4444
#   ssh_ca_force       default false — re-request even if the certificate is current
# Env on the runner pod: OPS_CERT_MINT_TOKEN.

- name: "ssh_ca: the gateway runs the iotgw agent (it performs the enrollment)"
  ansible.builtin.stat:
    path: /usr/sbin/iotgw
  register: iotgw_bin
  tags: [ssh_ca]

- name: "ssh_ca: fail clearly without the agent"
  ansible.builtin.assert:
    that: iotgw_bin.stat.exists
    fail_msg: >-
      /usr/sbin/iotgw is missing: SSH enrollment goes through the iotgw agent
      (decision-033). Reinstall the gateway with the current install flow.
    quiet: true
  tags: [ssh_ca]

- name: "ssh_ca: is a host certificate already installed (enrolled)?"
  ansible.builtin.stat:
    path: /etc/ssh/ssh_host_ecdsa_key-cert.pub
  register: cert_stat
  tags: [ssh_ca]

- name: "ssh_ca: set service facts"
  ansible.builtin.set_fact:
    sshd_bin: /usr/sbin/sshd
    iotgw_backend_url: "{{ iotgw_backend_url | default('http://iotgw-ui-backend.iotgw-ui.svc.cluster.local:4444') }}"
  tags: [ssh_ca]

# ── enrolled: renew with the host key (no code) ─────────────────────────────
# NOTE: the gekmihesg.openwrt role re-implements modules in shell and does not
# support `command: argv` — keep plain `cmd` strings.
- name: "ssh_ca: renew through the agent (host-key signed, no code)"
  when: cert_stat.stat.exists
  ansible.builtin.command:
    cmd: "/usr/sbin/iotgw ssh refresh{{ ' -force' if (ssh_ca_force | default(false) | bool) else '' }}"
  register: ssh_refresh_out
  changed_when: "'nothing to do' not in ssh_refresh_out.stdout"
  tags: [ssh_ca]

# ── not enrolled: first enrollment with a backend-issued one-time code ───────
- name: "ssh_ca: first enrollment"
  when: not cert_stat.stat.exists
  tags: [ssh_ca]
  block:
    - name: "ssh_ca: require the device uuid and the backend credential"
      ansible.builtin.assert:
        that:
          - device_uuid is defined and device_uuid | length > 0
          - lookup('ansible.builtin.env', 'OPS_CERT_MINT_TOKEN') | length > 0
        fail_msg: >-
          First SSH enrollment needs json_data.device_uuid and the runner's
          OPS_CERT_MINT_TOKEN (ops-cert-mint Secret) to get a one-time code.
        quiet: true

    - name: "ssh_ca: get a one-time code for this device from the backend (controller-side)"
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ iotgw_backend_url }}/internal/devices/enroll-code"
        method: POST
        headers:
          Authorization: "Bearer {{ lookup('ansible.builtin.env', 'OPS_CERT_MINT_TOKEN') }}"
        body_format: json
        body:
          device_uuid: "{{ device_uuid }}"
        return_content: true
      register: enroll_code
      no_log: true

    # The code goes to the gateway in a root-only file for this one call, so it
    # never appears in a command line, in the task output or in `ps`; the
    # command itself stays visible (its messages carry no code).
    - name: "ssh_ca: hand the code to the gateway (root-only file, removed right after)"
      ansible.builtin.copy:
        content: "{{ enroll_code.json.code }}"
        dest: /tmp/.iotgw-enroll-code
        mode: "0600"
      no_log: true

    - name: "ssh_ca: enroll through the agent with that code"
      ansible.builtin.shell:
        cmd: |
          code="$(cat /tmp/.iotgw-enroll-code)"; rm -f /tmp/.iotgw-enroll-code
          /usr/sbin/iotgw ssh refresh -otp "$code"
      register: ssh_refresh_out
  always:
    - name: "ssh_ca: make sure the code file is gone"
      ansible.builtin.file:
        path: /tmp/.iotgw-enroll-code
        state: absent

- name: "ssh_ca: agent output"
  ansible.builtin.debug:
    msg: "{{ ssh_refresh_out.stdout_lines | default([]) }}"
  tags: [ssh_ca]

# ── assert BOTH auth paths are live (always, even on a no-op run) ────────────
- name: "ssh_ca: read the effective sshd config"
  ansible.builtin.command:
    cmd: "{{ sshd_bin }} -T"
  register: sshd_effective
  changed_when: false
  tags: [ssh_ca]

- name: "ssh_ca: assert certificate auth AND break-glass are both live"
  ansible.builtin.assert:
    that:
      - "'trustedusercakeys /etc/ssh/ssh-user-ca.pub' in sshd_effective.stdout"
      - "'hostcertificate /etc/ssh/ssh_host_ecdsa_key-cert.pub' in sshd_effective.stdout"
      - "'authorizedkeysfile .ssh/authorized_keys' in sshd_effective.stdout"
    fail_msg: "enrollment did not take effect in the running sshd config"
    success_msg: "gateway accepts iotgw-admin certificates and keeps break-glass raw-key access"
  tags: [ssh_ca]
