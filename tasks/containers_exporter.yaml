- name: "containers_exporter: Check if Docker stack is running"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/containers_exporter
    state: present
  register: stack_status
  ignore_errors: true

- name: "containers_exporter: Teardown the Docker stack if running"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/containers_exporter
    state: absent
  when: stack_status is not failed

- name: "containers_exporter: Remove directory /opt/stacks/containers_exporter"
  ansible.builtin.file:
    path: /opt/stacks/containers_exporter
    state: absent

- name: 'containers_exporter: deploy stack files (task-073 §7: vendored in files/stacks/, no git clone)'
  ansible.builtin.copy:
    src: stacks/containers_exporter/
    dest: /opt/stacks/containers_exporter/
    mode: preserve
- name: "containers_exporter: Fetch env.j2"
  ansible.builtin.fetch:
    src: /opt/stacks/containers_exporter/env.j2
    dest: /tmp/env.j2
    flat: yes

- name: "containers_exporter: Template env.j2"
  ansible.builtin.template:
    src: /tmp/env.j2
    dest: /opt/stacks/containers_exporter/.env
    owner: root
    group: root
    mode: '0640'

- name: "containers_exporter: Start Docker stack"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/containers_exporter
    state: present
    recreate: always
  register: output

- name: "containers_exporter: Display stack startup logs"
  ansible.builtin.debug:
    var: output
