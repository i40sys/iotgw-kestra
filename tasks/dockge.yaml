# Re-provisioning tears the existing stack down before its directory is
# replaced; a fresh gateway has none. Look for its compose file (every name
# `docker compose` accepts, so a stack an older revision deployed is found too)
# instead of running compose on a missing directory, which logged a red, ignored
# `fatal: ... is not a directory` on every first install (and `state: present`
# started an existing stack just to tear it down).
- name: "dockge: Look for an existing Docker stack"
  ansible.builtin.stat:
    path: "/opt/stacks/dockge/{{ item }}"
  loop: [compose.yaml, compose.yml, docker-compose.yaml, docker-compose.yml]
  register: stack_files

- name: "dockge: Teardown the existing Docker stack"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/dockge
    state: absent
  when: stack_files.results | selectattr('stat.exists') | list | length > 0

- name: "dockge: Remove directory /opt/stacks/dockge"
  ansible.builtin.file:
    path: /opt/stacks/dockge
    state: absent

- name: 'dockge: deploy stack files (task-073 §7: vendored in files/stacks/, no git clone)'
  ansible.builtin.copy:
    src: stacks/dockge/
    dest: /opt/stacks/dockge/
    mode: preserve
- name: "dockge: Start Docker stack"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/dockge
    state: present
  register: output

- name: "dockge: Display stack startup logs"
  ansible.builtin.debug:
    var: output
