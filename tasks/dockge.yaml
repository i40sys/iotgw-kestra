---
- name: "dockge: Check if Docker stack is running"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/dockge
    state: present
  register: stack_status
  ignore_errors: true
  
- name: "dockge: Teardown the Docker stack if running"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/dockge
    state: absent
  when: stack_status is not failed
  
- name: "dockge: Remove directory /opt/stacks/dockge"
  ansible.builtin.file:
    path: /opt/stacks/dockge
    state: absent
  
- name: "dockge: clonning repos"
  ansible.builtin.git:
    repo: 'git@github.com:example-org/iotgw_dockge.git'
    dest: /opt/stacks/dockge
    accept_hostkey: true
    key_file: /root/.ssh/id_rsa
  
- name: "dockge: adding GIT pre-push hook"
  ansible.builtin.copy:
    src: pre-push
    dest: /opt/stacks/dockge/.git/hooks/pre-push
    owner: root
    group: root
    mode: '0755'
  
- name: "dockge: Start Docker stack"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/dockge
    state: present
  register: output

- name: "dockge: Display stack startup logs"
  ansible.builtin.debug:
    var: output
