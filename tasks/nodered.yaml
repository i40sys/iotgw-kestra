# The flows repo is optional (`nodered_flows_repo`); preflight resolves it, but
# the install playbook has no preflight, so resolve it here too.
- name: "nodered: resolve the optional flows repo"
  ansible.builtin.set_fact:
    iotgw_nodered_flows_repo: "{{ iotgw_nodered_flows_repo | default(nodered_flows_repo | default(false) | bool) | bool }}"

# ONE Node-RED version for the stack (compose, via .env) and the password-hash
# helper below. An exact release, so every gateway runs the same build. A
# `nodered_version` variable overrides it (the harness uses it for the upgrade test;
# the deployment schema does not expose it).
- name: "nodered: resolve the Node-RED version"
  ansible.builtin.set_fact:
    iotgw_nodered_version: "{{ nodered_version | default('5.0.9', true) | string }}"

- name: "nodered: Check if Docker stack is running"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/nodered
    state: present
  register: stack_status
  ignore_errors: true

- name: "nodered: Teardown the Docker stack if running"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/nodered
    state: absent
  when: stack_status is not failed

# Keep data/: without a flows repo the flows live only in data/flows.json, so
# wiping the whole directory (as before) would lose them on every run.
- name: "nodered: Find the previous stack files (all but data/)"
  ansible.builtin.find:
    paths: /opt/stacks/nodered
    file_type: any
    hidden: true
    excludes: [data]
  register: nodered_old_files

- name: "nodered: Remove the previous stack files"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ nodered_old_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: 'nodered: deploy stack files (task-073 §7: vendored in files/stacks/, no git clone)'
  ansible.builtin.copy:
    src: stacks/nodered/
    dest: /opt/stacks/nodered/
    mode: preserve
- name: "nodered: setting up data directory"
  ansible.builtin.file:
    path: /opt/stacks/nodered/data
    state: directory
    owner: 1000
    group: 1000
    mode: '0755'

# task-130: the password travels in the container ENV, not interpolated into
# JS source on the command line (a quote in it broke the command and it was
# visible in the task args); the task and the hash are no_log.
- name: "nodered: cyphering admin password"
  community.docker.docker_container:
    name: nodered_temp
    image: "nodered/node-red:{{ iotgw_nodered_version }}"
    entrypoint: /usr/local/bin/node
    env:
      NR_ADMIN_PASSWORD: "{{ nodered_password }}"
    command: >
      -e "console.log(require('bcryptjs').hashSync(process.env.NR_ADMIN_PASSWORD, 8));"
    network_mode: host
    auto_remove: false  # Disable auto_remove to capture the output
    detach: false       # Run in the foreground to capture output
    tty: false
  register: nodered_tmp
  no_log: true

- name: "nodered: remove temporary container"
  community.docker.docker_container:
    name: nodered_temp
    state: absent

- name: "nodered: Fetch env.j2"
  ansible.builtin.fetch:
    src: /opt/stacks/nodered/env.j2
    dest: /tmp/env.j2
    flat: yes

- name: "nodered: Template env.j2"
  ansible.builtin.template:
    src: /tmp/env.j2
    dest: /opt/stacks/nodered/.env
    owner: root
    group: root
    mode: '0640'
  no_log: true  # admin password hash

# ---- optional flows repo (nodered_flows_repo) ---------------------------------
- name: "nodered: Fetch .config.projects.json.j2"
  when: iotgw_nodered_flows_repo
  ansible.builtin.fetch:
    src: /opt/stacks/nodered/data/.config.projects.json.j2
    dest: /tmp/.config.projects.json.j2
    flat: yes

- name: "nodered: Update the .config.projects.json with new hostname"
  when: iotgw_nodered_flows_repo
  ansible.builtin.template:
    src: /tmp/.config.projects.json.j2
    dest: /opt/stacks/nodered/data/.config.projects.json
    force: true
    owner: 1000
    group: 1000
    mode: '0644'

- name: "nodered: clonning repos"
  when: iotgw_nodered_flows_repo
  ansible.builtin.git:
    repo: "git@github.com:{{ github_org }}/flows.{{ iotgw_hostname }}.git"
    dest: "/opt/stacks/nodered/data/projects/flows.{{ iotgw_hostname }}"
    accept_hostkey: true

    key_file: /root/.ssh/id_rsa
- name: "nodered: Find all directories inside /opt/stacks/nodered/data"
  ansible.builtin.find:
    paths: /opt/stacks/nodered/data
    recurse: yes
    hidden: true
    file_type: directory
  register: directories

- name: "nodered: set ownership and permissions on directories"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: 1000
    group: 1000
    mode: '0755'
  loop: "{{ directories.files }}"

- name: "nodered: find all files inside /opt/stacks/nodered/data"
  ansible.builtin.find:
    paths: /opt/stacks/nodered/data
    recurse: yes
    hidden: true
    file_type: file
  register: files

- name: "nodered: set ownership and permissions on files"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: file
    owner: 1000
    group: 1000
    mode: '0644'
  loop: "{{ files.files }}"

- name: "nodered: SSH key permissions"
  when: iotgw_nodered_flows_repo
  ansible.builtin.file:
    path: "/opt/stacks/nodered/data/projects/.sshkeys/admin_id_rsa"
    state: file
    owner: 1000
    group: 1000
    mode: '0600'

- name: "nodered: Start Docker stack"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/nodered
    state: present
  register: output

- name: "nodered: Display stack startup logs"
  ansible.builtin.debug:
    var: output
