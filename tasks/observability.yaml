- name: "alloy: Remove directory /opt/stacks/alloy"
  ansible.builtin.file:
    path: /opt/stacks/alloy
    state: absent

- name: 'alloy: deploy stack files (task-073 §7: vendored in files/stacks/, no git clone)'
  ansible.builtin.copy:
    src: stacks/alloy/
    dest: /opt/stacks/alloy/
    mode: preserve
- name: "alloy: creating required directories"
  ansible.builtin.file:
    path: "/opt/stacks/alloy/{{ item }}"
    state: directory
    mode: '0755'
  loop:
  - bin
  - lib

# OpenWrt is musl; the alloy binary needs glibc. contrib/glibc/ holds just the
# 4 files it links against, from a pinned Debian libc6 (PROVENANCE.md) — the
# former 18 MB contrib/glibc.tar.gz was never vendored, so this stack failed.
- name: "alloy: install glibc, alloy binary requirement."
  ansible.builtin.copy:
    src: /opt/stacks/alloy/contrib/glibc/
    dest: /opt/stacks/alloy/lib/x86_64-linux-gnu/
    remote_src: yes
    mode: preserve

# The binary's ELF interpreter is /lib64/ld-linux-x86-64.so.2; give it a /lib64
# when the image has none (the /lib link below then covers it).
- name: "alloy: check /lib64"
  ansible.builtin.stat:
    path: /lib64
  register: alloy_lib64

- name: "alloy: link /lib64 to /lib"
  ansible.builtin.file:
    src: /lib
    dest: /lib64
    state: link
  when: not alloy_lib64.stat.exists

- name: "alloy: linking glibc with the O.S."
  ansible.builtin.file:
    src: /opt/stacks/alloy/lib/x86_64-linux-gnu
    dest: /lib/x86_64-linux-gnu
    state: link

- name: "alloy: linking glibc with the O.S."
  ansible.builtin.file:
    src: /opt/stacks/alloy/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
    dest: /lib/ld-linux-x86-64.so.2
    state: link

- name: "alloy: link the loader in a real /lib64 directory"
  ansible.builtin.file:
    src: /opt/stacks/alloy/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
    dest: /lib64/ld-linux-x86-64.so.2
    state: link
  when: alloy_lib64.stat.exists and alloy_lib64.stat.isdir and not alloy_lib64.stat.islnk

- name: "alloy: changing permissions for glibc"
  ansible.builtin.file:
    path: /opt/stacks/alloy/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
    state: file
    owner: root
    group: root
    mode: '0755'
- name: "alloy: Fetch latest version of alloy"
  ansible.builtin.shell: |
    # curl -sL https://api.github.com/repos/grafana/alloy/releases/latest | jq -r ".tag_name"
    echo "v1.5.1"
  register: alloy_version
  changed_when: false

- name: "alloy: Download alloy"
  ansible.builtin.get_url:
    url: https://github.com/grafana/alloy/releases/download/{{ alloy_version.stdout }}/alloy-linux-amd64.zip
    dest: /tmp/alloy.zip

- name: "alloy: Unzip alloy.zip"
  ansible.builtin.unarchive:
    src: /tmp/alloy.zip
    dest: /opt/stacks/alloy/bin
    remote_src: yes

- name: "alloy: remove alloy.zip"
  ansible.builtin.file:
    path: /tmp/alloy.zip
    state: absent

- name: "alloy: Rename unzipped alloy file"
  ansible.builtin.command: mv /opt/stacks/alloy/bin/alloy-linux-amd64 /opt/stacks/alloy/bin/alloy

- name: "alloy: Set executable permissions on alloy.zip"
  ansible.builtin.file:
    path: "/opt/stacks/alloy/bin/alloy"
    mode: '0755'

- name: Set alloy config files
  ansible.builtin.set_fact:
    alloy_config_files:
    - writers.alloy
    - base.alloy
    - metrics.alloy

- name: "alloy: Fetch config {{ item }}.j2"
  ansible.builtin.fetch:
    src: "/opt/stacks/alloy/etc/templates/{{ item }}.j2"
    dest: "/tmp/{{ item }}.j2"
    flat: yes
  with_items: "{{ alloy_config_files }}"
- name: "alloy: Template {{ item }}.j2 > {{ item }}"
  ansible.builtin.template:
    src: "/tmp/{{ item }}.j2"
    dest: "/opt/stacks/alloy/etc/{{ item }}"
    owner: root
    group: root
    mode: '0640'
  with_items: "{{ alloy_config_files }}"
  no_log: true  # OAuth2 client secrets + kuma exporter password (task-130)
- name: "alloy: Clean up controller copy of {{ item }}.j2"
  ansible.builtin.file:
    path: /tmp/{{ item }}.j2
    state: absent
  delegate_to: localhost
  with_items: "{{ alloy_config_files }}"

- name: "alloy: binary execution permissions"
  ansible.builtin.file:
    path: "/opt/stacks/alloy/bin/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop:
  - alloy

- name: "alloy: Create symlink for service"
  ansible.builtin.file:
    src: /opt/stacks/alloy/contrib/alloy
    dest: /etc/init.d/alloy
    state: link

- name: "alloy: Enable alloy service on boot"
  community.general.openwrt_init:
    name: alloy
    enabled: yes

- name: "alloy: Start alloy service"
  community.general.openwrt_init:
    name: alloy
    state: restarted
