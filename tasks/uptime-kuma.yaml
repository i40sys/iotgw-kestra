# Uptime Kuma + AutoKuma (tag `uptime-kuma`, flag `uptime_kuma`).
#
# Starts from an empty database on every run (the stack directory is
# recreated): kuma comes up first, contrib/bootstrap-admin.js creates the admin
# from autokuma_username/autokuma_password, then AutoKuma creates the Docker
# socket and the monitors declared in compose.yml/.env. Monitors cover only the
# gateway's own services (its containers, DNS, MQTT broker and Alloy).

# Re-provisioning tears the existing stack down before its directory is
# replaced; a fresh gateway has none. Look for its compose file (every name
# `docker compose` accepts, so a stack an older revision deployed is found too)
# instead of running compose on a missing directory, which logged a red, ignored
# `fatal: ... is not a directory` on every first install (and `state: present`
# started an existing stack just to tear it down).
- name: "uptime-kuma: Look for an existing Docker stack"
  ansible.builtin.stat:
    path: "/opt/stacks/uptime/{{ item }}"
  loop: [compose.yaml, compose.yml, docker-compose.yaml, docker-compose.yml, .env]
  register: stack_files

- name: "uptime-kuma: Teardown the existing Docker stack"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/uptime
    state: absent
  vars:
    found: "{{ stack_files.results | selectattr('stat.exists') | map(attribute='item') | list }}"
  # Also needs .env: compose will not load this project without it (not even
  # to tear it down), and it is written just before the stack starts, so a
  # directory without it (a run that failed half-way) has no stack running.
  when: found | reject('eq', '.env') | list | length > 0 and '.env' in found

- name: "uptime-kuma: Remove directory /opt/stacks/uptime"
  ansible.builtin.file:
    path: /opt/stacks/uptime
    state: absent

- name: 'uptime-kuma: deploy stack files (task-073 §7: vendored in files/stacks/, no git clone)'
  ansible.builtin.copy:
    src: stacks/uptime/
    dest: /opt/stacks/uptime/
    mode: preserve

- name: "uptime-kuma: Template .env"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/files/stacks/uptime/env.j2"
    dest: /opt/stacks/uptime/.env
    owner: root
    group: root
    mode: '0640'
  no_log: true  # renders the admin credentials (task-130)

- name: "uptime-kuma: Start Uptime Kuma (without AutoKuma yet)"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/uptime
    services: [kuma]
    state: present
    wait: true
    wait_timeout: 180

# The credentials are read from the container's own env (.env), never passed
# on a command line.
- name: "uptime-kuma: Create the admin user (empty database)"
  ansible.builtin.shell: >-
    docker compose --project-directory /opt/stacks/uptime exec -T -w /app kuma
    node - < /opt/stacks/uptime/contrib/bootstrap-admin.js
  register: kuma_bootstrap
  retries: 5
  delay: 5
  until: kuma_bootstrap.rc == 0
  changed_when: "'admin created' in kuma_bootstrap.stdout"

- name: "uptime-kuma: Start AutoKuma"
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/uptime
    state: present
  register: output

- name: "uptime-kuma: Display stack startup logs"
  ansible.builtin.debug:
    var: output
