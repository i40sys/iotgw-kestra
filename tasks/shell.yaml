---
- name: "system: creating /root/bin"
  ansible.builtin.file:
    path: /root/bin/
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "system, oh-my-posh: downloading..."
  ansible.builtin.shell:
    cmd: |
      # VERSION=$(curl -sL https://api.github.com/repos/JanDeDobbeleer/oh-my-posh/releases/latest | jq -r ".tag_name")
      VERSION="v24.12.0"
      URL=https://github.com/JanDeDobbeleer/oh-my-posh/releases/download/$VERSION/posh-linux-amd64
      FILENAME=oh-my-posh
      TARGET=/root/bin

      wget $URL -O $TARGET/$FILENAME
      chmod 755 $TARGET/$FILENAME

- name: "system, oh-my-posh: configuration"
  ansible.builtin.copy:
    src: theme.omp.json
    dest: /root/.theme.omp.json 
    owner: root
    group: root
    mode: '0644'

- name: "system, fzf: downloading..."
  ansible.builtin.shell:
    cmd: |
      # VERSION=$(curl -sL https://api.github.com/repos/junegunn/fzf/releases/latest | jq -r ".tag_name")
      VERSION="v0.57.0"
      REMOTE_FILENAME=fzf-${VERSION#v}-linux_amd64.tar.gz
      URL=https://github.com/junegunn/fzf/releases/download/$VERSION/${REMOTE_FILENAME}
      FILENAME=fzf
      TARGET=/root/bin

      wget $URL -O /tmp/$REMOTE_FILENAME
      cd $TARGET
      tar xvfz /tmp/$REMOTE_FILENAME
      chmod 755 $TARGET/$FILENAME

- name: "system: .bashrc setup"
  ansible.builtin.blockinfile:
    path: /root/.bashrc
    block: |
      export PATH=$PATH:~/bin:~/.local/bin
      export LANG=en_US.UTF-8
      # Oh-my-posh prompt
      eval "$(oh-my-posh --init --shell bash --config ~/.theme.omp.json)"
      # Set up fzf key bindings and fuzzy completion
      eval "$(fzf --bash)"
      #
      # Aliases:
      alias upgrade="opkg list-upgradable | cut -f 1 -d '' '' | xargs -r opkg upgrade"
    state: present
    create: yes
    owner: root
    group: root
    mode: '0640'

- name: "system, bugfix: VIM configuration"
  ansible.builtin.file:
    src: /usr/share/vim/vimrc
    dest: /usr/share/vim/defaults.vim
    owner: root
    group: root
    state: link
