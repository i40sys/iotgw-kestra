---
# ---- LAN addressing (iotgw-ng task-131) — read-only, BEFORE any change -------
# templates/network.j2 rewrites /etc/config/network wholesale. It used to
# hard-code the LAN netmask to /26, which shrank gw-c3's /24 site LAN
# (2026-09-25) and cut every host above .63 off its gateway. The netmask is
# never a constant any more: it comes from `local_netmask` in the deployment
# JSON (dotted or prefix length) or, when that is empty, from the gateway's
# CURRENT lan netmask. Everything the rewrite depends on (the netmask, the
# gateway address, the DHCP pool, the static leases) is checked here, before
# the play installs or changes anything on the gateway.
- name: "system, network: read the gateway's current LAN addressing"
  ansible.builtin.shell: |
    printf 'netmask=%s\n' "$(uci -q get network.lan.netmask)"
    printf 'ipaddr=%s\n'  "$(uci -q get network.lan.ipaddr)"
  register: lan_live
  changed_when: false

- name: "system, network: LAN netmask source (local_netmask first, then the gateway's current value)"
  ansible.builtin.set_fact:
    iotgw_lan_mask_src: >-
      {%- set src = local_netmask | default('', true) | string | trim -%}
      {%- if not src -%}
      {%-   set live_mask = (lan_live.stdout | regex_search('^netmask=(.*)$', '\\1', multiline=True) or ['']) | first | trim -%}
      {%-   set live_ip = (lan_live.stdout | regex_search('^ipaddr=(.*)$', '\\1', multiline=True) or ['']) | first | trim -%}
      {%-   set src = live_mask if live_mask else (live_ip.split('/')[1] if '/' in live_ip else '') -%}
      {%- endif -%}
      {{ src }}

- name: "system, network: LAN prefix length"
  ansible.builtin.set_fact:
    # 0 = could not be resolved (asserted below). A dotted mask is summed per
    # octet; a non-contiguous one is caught by the round-trip check below.
    iotgw_lan_prefix: >-
      {%- set bits = {'255': 8, '254': 7, '252': 6, '248': 5, '240': 4, '224': 3, '192': 2, '128': 1, '0': 0} -%}
      {%- if iotgw_lan_mask_src is match('^/?[0-9]{1,2}$') -%}
      {{ iotgw_lan_mask_src | regex_replace('^/', '') | int }}
      {%- elif iotgw_lan_mask_src is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$') and (iotgw_lan_mask_src.split('.') | reject('in', bits) | list | length == 0) -%}
      {{ iotgw_lan_mask_src.split('.') | map('extract', bits) | sum }}
      {%- else -%}
      0
      {%- endif -%}

- name: "system, network: LAN netmask, subnet size, gateway address and DHCP pool"
  ansible.builtin.set_fact:
    iotgw_lan_netmask: >-
      {%- for i in range(4) -%}
      {%-   set b = [[(iotgw_lan_prefix | int) - 8 * i, 0] | max, 8] | min -%}
      {{ 256 - 2 ** (8 - b) }}{{ '.' if not loop.last }}
      {%- endfor -%}
    iotgw_lan_size: "{{ 2 ** (32 - (iotgw_lan_prefix | int)) }}"
    iotgw_lan_ip_int: >-
      {%- set o = local_ip_address.split('.') | map('int') | list -%}
      {{ o[0] * 16777216 + o[1] * 65536 + o[2] * 256 + o[3] }}
    # templates/dhcp.j2 serves offsets .40-.89 of the subnet; a smaller subnet
    # gets a shorter pool that still ends before the broadcast address.
    iotgw_dhcp_start: 40
    iotgw_dhcp_limit: "{{ [50, 2 ** (32 - (iotgw_lan_prefix | int)) - 41] | min }}"

- name: "system, network: refuse an invalid or unknown LAN netmask"
  ansible.builtin.assert:
    that:
      - (iotgw_lan_prefix | int) >= 8 and (iotgw_lan_prefix | int) <= 30
      - iotgw_lan_mask_src is not match('^([0-9]{1,3}\.){3}[0-9]{1,3}$') or iotgw_lan_mask_src == iotgw_lan_netmask
    fail_msg: >-
      Refusing to rewrite /etc/config/network: the LAN netmask
      {{ ('local_netmask=' ~ iotgw_lan_mask_src) if (local_netmask | default('', true) | string | trim) else
         ('read from the gateway (' ~ (iotgw_lan_mask_src or 'none') ~ ')') }}
      is not a contiguous netmask / prefix between 8 and 30. Set `local_netmask`
      (e.g. 255.255.255.0 or 24) in the deployment configuration.
    quiet: true

- name: "system, network: the LAN address, DHCP pool and static leases fit the netmask"
  ansible.builtin.assert:
    that:
      - (iotgw_lan_ip_int | int) % (iotgw_lan_size | int) not in [0, (iotgw_lan_size | int) - 1]
      - (iotgw_lan_dhcp_limit_ok | bool)
      - _outside | length == 0
    fail_msg: >-
      LAN {{ local_ip_address }}/{{ iotgw_lan_prefix }}: the gateway address must be
      a host address of the subnet, the subnet must hold the DHCP pool (offset 40,
      so /26 or larger), and every dhcp_hosts ip must be inside it
      {%- if _outside | length %} (outside: {{ _outside | join(', ') }}){% endif %}.
    quiet: true
  vars:
    iotgw_lan_dhcp_limit_ok: "{{ (iotgw_dhcp_limit | int) >= 1 }}"
    _outside: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for h in (dhcp_hosts | default([], true)) -%}
      {%-   set o = (h.ip | string).split('.') | map('int') | list -%}
      {%-   set n = o[0] * 16777216 + o[1] * 65536 + o[2] * 256 + o[3] -%}
      {%-   if n // (iotgw_lan_size | int) != (iotgw_lan_ip_int | int) // (iotgw_lan_size | int) or n % (iotgw_lan_size | int) in [0, (iotgw_lan_size | int) - 1] -%}
      {%-     set ns.out = ns.out + [h.name ~ ' ' ~ h.ip] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.out }}

- name: "system, network: LAN that will be written"
  ansible.builtin.debug:
    msg: >-
      br-lan {{ local_ip_address }}/{{ iotgw_lan_prefix }} ({{ iotgw_lan_netmask }},
      from {{ 'local_netmask' if (local_netmask | default('', true) | string | trim) else 'the gateway' }});
      DHCP pool offset {{ iotgw_dhcp_start }}, {{ iotgw_dhcp_limit }} addresses

- name: "system: checking resolv.conf link"
  ansible.builtin.file:
    src: /tmp/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: yes
    owner: root
    group: root

- name: "system: Install packages using opkg"
  community.general.opkg:
    update_cache: true
    name: bash
    state: present

- name: "system: Read package list from file"
  ansible.builtin.slurp:
    src: files/lists/packages.lst
  register: package_file
  delegate_to: localhost

- name: "system: Convert package list to items"
  ansible.builtin.set_fact:
    package_list: "{{ package_file.content | b64decode | split('\n') | select('match', '^\\S+$') | list }}"

- name: "system: Get list of already installed packages"
  ansible.builtin.command: opkg list-installed
  register: installed_packages

- name: "system: Parse installed packages"
  ansible.builtin.set_fact:
    installed_package_list: "{{ installed_packages.stdout_lines | map('regex_replace', '\\s+.*$', '') | list }}"

- name: "system: Determine packages to install"
  ansible.builtin.set_fact:
    packages_to_install: "{{ package_list | difference(installed_package_list) }}"

- name: "system: Debug summary of packages"
  ansible.builtin.debug:
    msg: |
      Summary of Packages:
      - Number of packages to install from file: {{ package_list | length }}
      - Number of installed packages: {{ installed_package_list | length }}
      - Number of packages to install after contrasting: {{ packages_to_install | length }}

- name: "system: Install packages using opkg"
  community.general.opkg:
    name: "{{ item }}"
    state: present
  loop: "{{ packages_to_install }}"

- name: "system: Installing usermod for changing root password"
  community.general.opkg:
    name: shadow-usermod
    state: present

- name: "system: setting root password"
  ansible.builtin.user:
    name: root
    password: "{{ root_password | password_hash('sha512') }}"
    shell: /bin/bash
  no_log: true

- name: "system: Replace sftp-server with internal-sftp in sshd_config"
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Subsystem\s+sftp\s+'
    line: 'Subsystem sftp internal-sftp'
    backup: yes

# task-098 (decision-027 phase 4): sshd LogLevel VERBOSE fleet-wide so the auth
# log distinguishes a CERTIFICATE login (`Accepted publickey ... ID <keyid>
# (serial N) CA <fp>`) from a raw break-glass key (`Accepted publickey ...` with
# no ID/CA) — the phase-4 "zero raw-key logins for two weeks" gate cannot be
# evidenced without it. Gated on `sshd -t` so a bad edit never reaches the daemon.
- name: "system: sshd LogLevel VERBOSE (cert-vs-rawkey auth accounting)"
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*LogLevel\s+'
    line: 'LogLevel VERBOSE'
    validate: '/usr/sbin/sshd -t -f %s'
    backup: yes

- name: "system: sshd service reload and restart"
  ansible.builtin.shell: |
      /etc/init.d/sshd reload
      /etc/init.d/sshd restart

# The shared /root/.ssh/id_rsa is NO LONGER used to clone the private stack repos
# (task-073 §7: the git tasks now clone over HTTPS with a short-lived GitHub App
# token minted in the runner). This deployment is therefore OPTIONAL break-glass
# only, and stays gated OFF by default (`deploy_shared_ssh_key`). decision-023 R1
# (a load-bearing shared key) is removed by that change.
- name: "system: setting SSH pub key"
  ansible.builtin.copy:
    src: credentials/id_rsa.pub
    dest: /root/.ssh/id_rsa.pub
    mode: "0644"
  when: deploy_shared_ssh_key | default(false) | bool
  
- name: "system: setting SSH private key"
  ansible.builtin.copy:
    src: credentials/id_rsa
    dest: /root/.ssh/id_rsa
    mode: "0600"
  when: deploy_shared_ssh_key | default(false) | bool

# Also tagged `ntp`: `--tags ntp` re-renders only hostname + NTP servers.
- name: "system: configuration"
  ansible.builtin.template:
    src: templates/system.j2
    dest: /etc/config/system
    owner: root
    group: root
    mode: '0644'
  tags: [ntp]

- name: "system, luci: dark mode"
  uci:
    command: set
    key: luci.main
    value:
      mediaurlbase: "/luci-static/bootstrap-dark"

- name: "system, luci: timeout 0"
  uci:
    command: set
    key: uhttpd.main
    value:
      http_keepalive: 0

- name: "system: force hostname apply and create as /etc/machine-id"
  ansible.builtin.shell: |
      echo $(uci get system.@system[0].hostname) > /proc/sys/kernel/hostname
      echo $(uci get system.@system[0].hostname) > /etc/machine-id

# templates/network.j2 REWRITES /etc/config/network wholesale, including the
# WireGuard management VPN (wg0) — on a gateway reached only through that VPN a
# wrong or empty wg0 is a lock-out at the next network reload/reboot. The wg0
# values are therefore NOT taken from the deployment JSON: they are read back
# from the gateway's live config (written at install by files/setup_vpn.sh and
# kept by the iotgw agent, decision-032), asserted complete, and re-emitted
# verbatim. `vpn_*` extra-vars are only a fallback for a gateway that has no
# wg0 yet (iotgw-ng task-130).
- name: "system, network: read the gateway's live WireGuard (wg0) configuration"
  ansible.builtin.shell: |
    printf 'private_key=%s\n'   "$(uci -q get network.wg0.private_key)"
    printf 'addresses=%s\n'     "$(uci -q get network.wg0.addresses)"
    printf 'public_key=%s\n'    "$(uci -q get network.@wireguard_wg0[0].public_key)"
    printf 'endpoint_host=%s\n' "$(uci -q get network.@wireguard_wg0[0].endpoint_host)"
    printf 'endpoint_port=%s\n' "$(uci -q get network.@wireguard_wg0[0].endpoint_port)"
  register: wg0_live
  changed_when: false
  no_log: true

- name: "system, network: wg0 values to re-emit (live gateway first, vpn_* fallback)"
  ansible.builtin.set_fact:
    iotgw_wg0_private_key: "{{ (wg0_live.stdout | regex_search('^private_key=(.*)$', '\\1', multiline=True) or ['']) | first or vpn_private_key | default('') }}"
    iotgw_wg0_addresses: "{{ (wg0_live.stdout | regex_search('^addresses=(.*)$', '\\1', multiline=True) or ['']) | first or vpn_ip_address | default('') }}"
    iotgw_wg0_public_key: "{{ (wg0_live.stdout | regex_search('^public_key=(.*)$', '\\1', multiline=True) or ['']) | first or vpn_public_key | default('') }}"
    iotgw_wg0_endpoint_host: "{{ (wg0_live.stdout | regex_search('^endpoint_host=(.*)$', '\\1', multiline=True) or ['']) | first or vpn_server_ip | default('') }}"
    iotgw_wg0_endpoint_port: "{{ (wg0_live.stdout | regex_search('^endpoint_port=(.*)$', '\\1', multiline=True) or ['']) | first or vpn_server_port | default('') }}"
  no_log: true

- name: "system, network: refuse to rewrite /etc/config/network without a complete wg0"
  ansible.builtin.assert:
    that:
      - iotgw_wg0_private_key | trim | length > 0
      - iotgw_wg0_addresses | trim | length > 0
      - iotgw_wg0_public_key | trim | length > 0
      - iotgw_wg0_endpoint_host | trim | length > 0
      - (iotgw_wg0_endpoint_port | string) is match('^[0-9]+$')
    fail_msg: >-
      Refusing to rewrite /etc/config/network: the gateway has no complete wg0
      (WireGuard) configuration and no vpn_* fallback was supplied. Rewriting it
      would drop the management VPN. Check `uci show network.wg0` on the gateway.
    quiet: true

# Keep the previous file OUTSIDE /etc/config (uci would parse a backup there as
# another package) so a bad rewrite can be rolled back by hand (task-130).
- name: "system, network: back up the current /etc/config/network"
  ansible.builtin.shell: |
    mkdir -p /root/.iotgw-provisioning-backup
    [ ! -f /etc/config/network ] || cp -p /etc/config/network /root/.iotgw-provisioning-backup/network.$(date +%Y%m%dT%H%M%S)
    chmod 0700 /root/.iotgw-provisioning-backup

- name: "system, network: configuration"
  ansible.builtin.template:
    src: templates/network.j2
    dest: /etc/config/network
    owner: root
    group: root
    mode: '0600'
  no_log: true

# uci import network < /tmp/network_backup.conf

- name: "system, dhcp: configuration"
  ansible.builtin.template:
    src: templates/dhcp.j2
    dest: /etc/config/dhcp
    owner: root
    group: root
    mode: '0644'

# Static leases AFTER the dhcp template (which rewrites the file) and committed
# here: before task-130 they were staged BEFORE the rewrite and only persisted
# if a later tag happened to run `uci commit` — `--tags system` lost them.
- name: "system, dhcp: static leases (dhcp_hosts)"
  ansible.builtin.shell: |
    uci add dhcp host
    uci set dhcp.@host[-1].name='{{ item.name }}'
    uci set dhcp.@host[-1].ip='{{ item.ip }}'
    uci add_list dhcp.@host[-1].mac='{{ item.mac }}'
    uci set dhcp.@host[-1].leasetime='24h'
  loop: "{{ dhcp_hosts }}"
  loop_control:
    label: "{{ item.name }}"
  when: dhcp_hosts is defined and dhcp_hosts is not none and dhcp_hosts | length > 0

- name: "system, dhcp: commit static leases"
  ansible.builtin.command: uci commit dhcp
  when: dhcp_hosts is defined and dhcp_hosts is not none and dhcp_hosts | length > 0

- name: "system, dockerd: configuration"
  ansible.builtin.template:
    src: templates/dockerd.j2
    dest: /etc/config/dockerd
    owner: root
    group: root
    mode: '0644'

- name: "system, dockerd: creating directory for daemon.json"
  ansible.builtin.file:
    path: /opt/docker/etc
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "system, dockerd: configuration daemon.json"
  ansible.builtin.template:
    src: templates/daemon.json.j2
    dest: /opt/docker/etc/daemon.json
    owner: root
    group: root
    mode: '0644'

- name: "system, docker compose: copying script for downloading and installing plugin"
  ansible.builtin.copy:
    src: install_docker-compose.sh
    dest: /tmp/install_docker-compose.sh
    owner: root
    group: root
    mode: '0755'

- name: "system, docker compose: run script for downloading and installing plugin"
  ansible.builtin.command:
    cmd: /tmp/install_docker-compose.sh

- name: "system, authossh: configuration"
  ansible.builtin.template:
    src: templates/autossh.j2
    dest: /etc/config/autossh
    owner: root
    group: root
    mode: '0644'

- name: "system, ttyd: configuration"
  ansible.builtin.template:
    src: templates/ttyd.j2
    dest: /etc/config/ttyd
    owner: root
    group: root
    mode: '0600'

- name: "system, LuCI: modifying menu"
  ansible.builtin.template:
    src: files/apps.lua
    dest: /usr/lib/lua/luci/controller/apps.lua
    owner: root
    group: root
    mode: '0644'

- name: "system: python uv install"
  ansible.builtin.shell: |
    curl -LsSf https://astral.sh/uv/install.sh | sh
