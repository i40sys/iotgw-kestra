name: vscode

x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "1"

services:
  editor:
    image: lscr.io/linuxserver/code-server:4.141.0-ls371@sha256:05e7025352fc8a8cdfbce07bf80c26c6dc7a0d1f1e99b2bb5e19b6a98d559897
    volumes:
      - /opt/stacks/vscode/config:/config
      - /opt/stacks/vscode/config/.ssh:/root/.ssh
      - /root/.bashrc:/config/.bashrc
      - /:/mnt
      # - /opt/stacks:/mnt/opt/stacks
      # - /opt/containerd:/mnt/opt/containerd
      # - /etc:/mnt/etc
      # - /root:/mnt/root
      # - /boot:/mnt/boot
      # - /www:/mnt/www
    restart: unless-stopped
    network_mode: host
    # ports:
    #   - 8443:8443
    env_file:
      - .env
    labels:
      kuma.__container: '{"name": "vscode"}'
    logging: *default-logging
