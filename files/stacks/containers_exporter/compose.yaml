name: containers_exporter

x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "1"

services:
  srv:
    image: ghcr.io/oriolrius/docker_container_exporter:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # The exporter listens on $PORT (from .env, containers_exporter_port), not on
      # a fixed 8118: publish that same port (Alloy scrapes it, metrics.alloy.j2).
      - "127.0.0.1:${PORT}:${PORT}"
    privileged: true
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: '{"name": "containers_exporter"}'
