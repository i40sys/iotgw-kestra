name: uptime

x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "1"

services:
  kuma:
    # Pinned: contrib/bootstrap-admin.js relies on the 1.x setup/login socket API.
    image: louislam/uptime-kuma:1.23.17
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/stacks/uptime/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://127.0.0.1:$${UPTIME_KUMA_PORT} >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
  autokuma:
    image: ghcr.io/bigboot/autokuma:uptime-kuma-v1-2.0.0  # the v1-compatible build; plain 2.x targets Uptime Kuma 2
    restart: unless-stopped
    env_file:
      - .env
    labels:
      # The local Docker socket, referenced by the container monitors.
      kuma.local_socket.docker_host.name: 'local socket'
      kuma.local_socket.docker_host.connection_type: 'socket'
      kuma.local_socket.docker_host.path: '/var/run/docker.sock'
      kuma.docker_containers.group.name: 'docker_containers'
      kuma.local_services.group.name: 'local_services'
      kuma.__local_services: ""
    depends_on:
      kuma:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    network_mode: host
    logging: *default-logging
