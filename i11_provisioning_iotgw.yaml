---
- name: Software and Configure provisioning
  hosts: all
  remote_user: root
  gather_facts: false
  # iotgw-ng task-130: NO play-level defaults for the gateway's identity or
  # network. The former demo vars (iotgw_hostname iot-gw_maq0, root_password
  # "none", local_ip_address 10.121.100.1, local_domain, main_local_dns and the
  # misspelt, unused zeroter_network_id) were silently applied to any gateway
  # whose deployment JSON lacked them. Every value now comes from the deployment
  # configuration (Kestra json_data -> extra-vars) and tasks/preflight.yaml
  # asserts it, per enabled stack, before anything touches the gateway.
  # Contract: iotgw-ng iotgw-ui/packages/supabase-contract/src/deployment-config.schema.json

  pre_tasks:
    - import_tasks: tasks/preflight.yaml
      tags: always

  roles:
    - gekmihesg.openwrt
    # - i40sys.iot_stack  

  tasks:
    # `system` also carries the `ntp` tag on its /etc/config/system task.
    - import_tasks: tasks/system.yaml
      tags: system

    # SSH-CA enrollment (iotgw-ng decision-026 phase 3/6). Purely additive on the
    # gateway — it only writes under /etc/ssh and never touches authorized_keys,
    # so it cannot lock us out. Its tasks no-op unless the flow supplies the
    # enrollment vars (ssh_ca_endpoint / device_id / enroll_totp; supabase_anon_key
    # for the Kong route). Run it standalone against an already-deployed gateway
    # with `--tags ssh_ca` to migrate existing hardware (task-106).
    - import_tasks: tasks/ssh_ca.yaml
      tags: ssh_ca

    # Stacks with an enable flag in the deployment JSON run only when their tag
    # is selected AND the flag is not false (tasks/preflight.yaml, task-130).
    - import_tasks: tasks/firewall.yaml
      tags: firewall
      when: iotgw_stack_enabled['firewall']

    - import_tasks: tasks/syslog.yaml
      tags: syslog

    - import_tasks: tasks/shell.yaml
      tags: shell

    - import_tasks: tasks/credentials.yaml
      tags: credentials
      when: iotgw_stack_enabled['credentials']

    - import_tasks: tasks/dockge.yaml
      tags: dockge

    - import_tasks: tasks/vscode.yaml
      tags: vscode

    - import_tasks: tasks/containers_exporter.yaml
      tags: observability
      when: iotgw_stack_enabled['observability']

    - import_tasks: tasks/uptime-kuma.yaml
      tags: observability
      when: iotgw_stack_enabled['observability']

    - import_tasks: tasks/observability.yaml
      tags: observability
      when: iotgw_stack_enabled['observability']

    - import_tasks: tasks/mosquitto.yaml
      tags: mosquitto
      when: iotgw_stack_enabled['mosquitto']

    - import_tasks: tasks/glpi-agent.yaml
      tags: glpi-agent
      when: iotgw_stack_enabled['glpi-agent']

    - import_tasks: tasks/telegraf.yaml
      tags: telegraf
      when: iotgw_stack_enabled['telegraf']

    - import_tasks: tasks/duplicati.yaml
      tags: duplicati
      when: iotgw_stack_enabled['duplicati']

    - import_tasks: tasks/nodered.yaml
      tags: nodered
      when: iotgw_stack_enabled['nodered']

    - import_tasks: tasks/bugfixing.yaml
      tags: bugfixing

    - import_tasks: tasks/netxms-agent.yaml
      tags: netxms
      when: iotgw_stack_enabled['netxms']

    - import_tasks: tasks/lldpd.yaml
      tags: lldpd

    - import_tasks: tasks/plc_sniffer.yaml
      tags: plc_sniffer

    - name: Everything done.
      ansible.builtin.debug:
        msg: "Reboot the target machine and boot with hard drive."
      tags: always
