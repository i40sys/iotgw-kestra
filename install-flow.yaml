id: install
namespace: iotgw-ng

inputs:
  - id: json_data
    type: JSON
    description: "Target configuration for OpenWRT installation."
    defaults: '{"target_disk": "/dev/sda", "openwrt_version": "23.05.4", "target_ip": "0.0.0.0", "ssh_key_id": ""}'

tasks:
  - id: dump_input
    type: io.kestra.plugin.core.log.Log
    message:
      - "Install OpenWRT on: {{ inputs.json_data.target_ip }} disk: {{ inputs.json_data.target_disk }}"

  - id: create_inventory_file
    type: io.kestra.plugin.core.debug.Return
    format: |
      all:
        hosts:
          {{ inputs.json_data.target_ip }}:
        vars:
          ansible_user: 'root'
          ansible_python_interpreter: /usr/bin/python3
          # task-092 part 2b: the short-lived iotgw-ops USER CERTIFICATE minted
          # in-pod (see the command block below) replaces the per-device KMS key
          # (keys/id_rsa) as the SSH credential.
          #
          # NEEDS A HUMAN (operator step, task-092): unlike an already-enrolled
          # gateway, the LIVE-BOOTED rescue environment this flow targets has
          # never run ssh_ca and has no TrustedUserCAKeys — its sshd only trusts
          # whatever public key was baked into the live-boot media's
          # authorized_keys at build time (historically the same per-device KMS
          # key this change removes as the CONTROLLER's credential). For this hop
          # to keep working on REAL hardware, the live-boot image/USB/PXE artifact
          # must be updated to trust the domain's User CA (or be seeded with the
          # iotgw-ops public key) — the same class of operator prerequisite as
          # the bastion TrustedUserCAKeys note in Flow.yaml. Not configured here.
          ansible_ssh_private_key_file: "/tmp/ops_key"
          # TOFU IS INTENTIONAL HERE (task-093 AC#4): this flow installs the OS
          # onto a LIVE-booted machine that has no host certificate yet — the
          # live-boot phase keeps Trust-On-First-Use until decision-028 §5 is
          # resolved. Do NOT switch this to cert verification; there is nothing
          # to verify against until after enrollment (Flow.yaml/ssh_ca).
          # BASTION HOP (decision-030): the controller has no L3 route into the
          # per-network Netmaker/WireGuard subnets, so SSH reaches the live-booted
          # gateway through the Netmaker host {{ kv('VPN_JUMP_HOST') }} as a
          # ProxyCommand jump — the same hop as connectivity-check-flow.yaml and
          # Flow.yaml, via the `iotgw-jump` account that accepts the iotgw-ops
          # user cert (iotgw-ng scripts/ssh-ca/bastion-trust.sh).
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o CertificateFile=/tmp/ops_key-cert.pub -o ProxyCommand="ssh -i /tmp/ops_key -o CertificateFile=/tmp/ops_key-cert.pub -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p -q iotgw-jump@{{ kv('VPN_JUMP_HOST') }}"'

  - id: run_install
    type: io.kestra.plugin.kubernetes.core.PodCreate
    # No `connection` block: uses in-cluster service account.
    # ServiceAccount `kestra` with Role `kestra-pod-runner` (deploy/k8s/base/kestra/kestra-rbac.yaml).
    # Plugin: io.kestra.plugin.kubernetes v1.9.1; connection=null -> fabric8 auto-detects in-cluster.
    # k8s namespace for the runner pod: `kestra` (namespace-per-subproject split,
    # decision-020 / task-064 — the former `iotgw` namespace no longer exists).
    namespace: kestra
    metadata:
      labels:
        app.kubernetes.io/managed-by: kestra
        kestra.io/flow: install
    # task-065 residual fix: injecting all namespace files as individual
    # inputFiles (one exec/tar stream each into the busybox init-files
    # container) took minutes on kind/WSL2 — file COUNT, not bytes, is the
    # bottleneck. Instead we inject only the tiny runtime-generated
    # inventory.yml here and `git clone` the (public) namespace repo straight
    # into the pod's workingDir in the container command below.
    inputFiles:
      inventory.yml: "{{ outputs.create_inventory_file.value }}"
    spec:
      restartPolicy: Never
      containers:
        - name: ansible
          # PINNED (iotgw-ng task-129): ansible-core 2.18.19 + community.general
          # 10.7.6 + community.docker 4.8.5 bundled. `latest-tools` silently moved
          # to ansible-core 2.21, which breaks the gekmihesg.openwrt role (its
          # monkeypatch needs the pre-2.19 _configure_module 4-tuple). Bump the
          # tag AND digest together, and re-test provisioning.
          image: cytopia/ansible:2.18-tools@sha256:da5e5a6066afb11ef1541a7eff690ec28a1af9647c4f04533f71d3f7fcd1affe
          env:
            # task-092 part 2b: short-lived iotgw-ops SSH USER CERTIFICATE, minted
            # by the iotgw-ui backend's internal /ssh/ops-cert endpoint, replaces
            # the per-device KMS key (keys/id_rsa) as the SSH auth mechanism for
            # this flow (AC#4 — no more KMS-fetch-to-keys/id_rsa block). NOT
            # optional: a missing Secret fails the pod at creation
            # (CreateContainerConfigError) rather than silently having no token.
            - name: OPS_CERT_MINT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-cert-mint
                  key: OPS_CERT_MINT_TOKEN
          command:
            - /bin/bash
            - -c
            - |
              set -e
              # task-065 residual fix: clone the (public) namespace repo straight into
              # the pod's workingDir instead of injecting its files as inputFiles (see
              # Flow.yaml for the full rationale). Runs before anything else so
              # d01_install_owrt.yml / fetch_kms_key.py are present; inventory.yml is
              # injected via inputFiles (not in the repo) so this cannot clobber it.
              git clone --depth 1 https://github.com/i40sys/iotgw-kestra /tmp/nsrepo
              cp -a /tmp/nsrepo/. .
              rm -rf .git /tmp/nsrepo
              # task-092 part 2b: mint a short-lived iotgw-ops SSH USER CERTIFICATE
              # from the iotgw-ui backend instead of fetching a per-device key from
              # KMS — keys/id_rsa is no longer the SSH auth path (AC#4).
              # cytopia/ansible:2.18-tools (Alpine) ships neither openssl nor curl.
              apk add --no-cache openssl curl
              ssh-keygen -q -t ed25519 -N '' -f /tmp/ops_key -C iotgw-ops
              ZONE='{{ inputs.json_data.pki_zone | default("") }}'
              if [ -z "$OPS_CERT_MINT_TOKEN" ]; then
                echo "ERROR: OPS_CERT_MINT_TOKEN is empty — populate the 'ops-cert-mint' Secret in the kestra namespace (task-092)." >&2
                exit 1
              fi
              if [ -n "$ZONE" ]; then
                echo "Minting a short-lived iotgw-ops SSH user certificate for zone $ZONE..."
                curl -fsS -X POST http://iotgw-ui-backend.iotgw-ui.svc.cluster.local:4444/internal/ssh/ops-cert \
                  -H "Authorization: Bearer $OPS_CERT_MINT_TOKEN" -H "Content-Type: application/json" \
                  -d "{\"zone\":\"$ZONE\",\"sshPublicKey\":\"$(cat /tmp/ops_key.pub)\"}" \
                  | python3 -c 'import sys,json;open("/tmp/ops_key-cert.pub","w").write(json.load(sys.stdin)["certificate"])'
                chmod 600 /tmp/ops_key
                echo "iotgw-ops certificate minted: $(ssh-keygen -L -f /tmp/ops_key-cert.pub | head -3)"
              else
                echo "No json_data.pki_zone provided — skipping iotgw-ops cert mint; SSH will present an uncertified ephemeral key and is expected to fail authentication."
              fi
              ansible-playbook -i inventory.yml d01_install_owrt.yml \
                -e "target_disk={{ inputs.json_data.target_disk }}" \
                -e "openwrt_version={{ inputs.json_data.openwrt_version }}" \
                -e "device_id={{ inputs.json_data.device_id ?? '' }}" \
                -e "device_uuid={{ inputs.json_data.device_uuid ?? '' }}" \
                -e "network_id={{ inputs.json_data.network_id ?? '' }}" \
                -e "domain_id={{ inputs.json_data.domain_id ?? '' }}"
          workingDir: "{{ workingDir }}"
