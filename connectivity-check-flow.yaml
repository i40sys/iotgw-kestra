id: connectivity-check
namespace: iotgw-ng

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"

inputs:
  - id: json_data
    type: JSON
    description: >-
      Per-device connectivity-check payload from the backend (task-092):
      target_ip, device_id, device_name, pki_zone (the domain's pki-manager
      zone, used to mint the short-lived iotgw-ops SSH user certificate that
      replaces the per-device KMS key as the SSH auth mechanism, AC#4).
      Defaults give the scheduled cron run — which has no device identity —
      a dummy 0.0.0.0 target and an empty zone (the runner pod then skips the
      cert mint and lets the SSH step fail naturally).
    defaults: '{"target_ip": "0.0.0.0", "device_id": "", "device_name": "", "pki_zone": ""}'
  - id: cert_fqdn
    type: STRING
    description: >-
      The gateway's certified host FQDN (the device row's ssh_host_fqdn,
      recorded at enrollment — a principal on its host certificate, e.g.
      <name>-<id8>.<network>.<domain>.iotgw). When set together with
      pki_host_ca_id, the flow verifies the host certificate instead of TOFU
      (task-093): the pod builds an @cert-authority known_hosts and the
      inventory pins the connect name to this FQDN with HostKeyAlias. Empty
      for the scheduled cron run (no device identity → TOFU).
    defaults: ""
  - id: pki_host_ca_id
    type: STRING
    description: >-
      The domain's Host CA id (domains.pki_host_ca_id). The pod fetches the
      CA public key from the PUBLIC, id-addressed pki route
      $PKI_BASE_URL/ssh/cas/<id>/ca.pub (no auth — same source as
      scripts/ssh-ca/trust.sh) to build the @cert-authority line. Empty →
      host verification stays TOFU (task-093).
    defaults: ""
  - id: pki_base_url
    type: STRING
    description: "Base URL of pki-manager's public routes (Host CA fetch, task-093)."
    defaults: "https://pki.joor.net"

tasks:
  - id: create_inventory_file
    type: io.kestra.plugin.core.debug.Return
    format: |
      all:
        hosts:
          {{ inputs.json_data.target_ip }}:
        vars:
          ansible_user: 'root'
          ansible_python_interpreter: /usr/bin/python3
          # task-092 part 2b: the short-lived iotgw-ops USER CERTIFICATE minted
          # in-pod (see the command block below) replaces the per-device KMS key
          # (keys/id_rsa) as the SSH credential.
          ansible_ssh_private_key_file: "/tmp/ops_key"
          # BASTION HOP (both branches below): the controller has no L3 route
          # into the per-network Netmaker/WireGuard subnets, so SSH reaches the
          # gateway through the Netmaker host {{ kv('VPN_JUMP_HOST') }} as a
          # ProxyCommand jump — the same hop, and the same bastion TOFU posture
          # (task-093 AC#3), as Flow.yaml. The bastion must accept the iotgw-ops
          # user cert — the dedicated `iotgw-jump` account installed by
          # iotgw-ng scripts/ssh-ca/bastion-trust.sh (decision-030).
      {% if inputs.cert_fqdn != '' and inputs.pki_host_ca_id != '' %}
          # TASK-093: this flow runs against a PROVISIONED+ENROLLED gateway, so it
          # VERIFIES the host certificate instead of TOFU. The pod fetched the
          # domain Host CA (public route /ssh/cas/{{ inputs.pki_host_ca_id }}/ca.pub)
          # and wrote  '@cert-authority {{ inputs.cert_fqdn }} <hostCa>'  to
          # keys/known_hosts. Pin the connect name to the certified FQDN with
          # HostKeyAlias so verification cannot silently fall back to TOFU;
          # GlobalKnownHostsFile=/dev/null isolates it from any system file.
          # HostKeyAlgorithms forces the ECDSA-P256 host CERTIFICATE (our enrollment
          # always signs the ecdsa host key, decision-024). Without it OpenSSH may
          # negotiate a plain host key the known_hosts has no entry for → verification
          # fails; with it, a gateway that presents no cert fails to negotiate at all
          # (which is the correct "cert absent → fail" behaviour, task-093 AC#1).
          ansible_ssh_common_args: '-o StrictHostKeyChecking=yes -o UserKnownHostsFile=keys/known_hosts -o GlobalKnownHostsFile=/dev/null -o HostKeyAlias={{ inputs.cert_fqdn }} -o HostKeyAlgorithms=ecdsa-sha2-nistp256-cert-v01@openssh.com -o CertificateFile=/tmp/ops_key-cert.pub -o ProxyCommand="ssh -i /tmp/ops_key -o CertificateFile=/tmp/ops_key-cert.pub -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p -q iotgw-jump@{{ kv('VPN_JUMP_HOST') }}"'
      {% else %}
          # No cert material supplied (the scheduled cron has no device identity)
          # → Trust-On-First-Use. A per-device run passes cert_fqdn + pki_host_ca_id
          # so the branch above runs and verifies the host certificate (task-093).
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o CertificateFile=/tmp/ops_key-cert.pub -o ProxyCommand="ssh -i /tmp/ops_key -o CertificateFile=/tmp/ops_key-cert.pub -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p -q iotgw-jump@{{ kv('VPN_JUMP_HOST') }}"'
      {% endif %}

  - id: run_connectivity_check
    type: io.kestra.plugin.kubernetes.core.PodCreate
    # No `connection` block: uses in-cluster service account.
    # ServiceAccount `kestra` with Role `kestra-pod-runner` (deploy/k8s/base/kestra/kestra-rbac.yaml).
    # Plugin: io.kestra.plugin.kubernetes v1.9.1; connection=null -> fabric8 auto-detects in-cluster.
    # k8s namespace for the runner pod: `kestra` (namespace-per-subproject split,
    # decision-020 / task-064 — the former `iotgw` namespace no longer exists).
    namespace: kestra
    metadata:
      labels:
        app.kubernetes.io/managed-by: kestra
        kestra.io/flow: connectivity-check
    # task-065 residual fix: rather than DownloadFiles+inputFiles per namespace
    # file (fine for the 2 files this flow used, but keep the three runner
    # flows consistent — see Flow.yaml for the full rationale), inject only
    # the tiny runtime-generated inventory.yml here and `git clone` the
    # (public) namespace repo straight into the pod's workingDir below.
    inputFiles:
      inventory.yml: "{{ outputs.create_inventory_file.value }}"
    spec:
      restartPolicy: Never
      containers:
        - name: ansible
          image: cytopia/ansible:latest-tools
          env:
            # task-092 part 2b: short-lived iotgw-ops SSH USER CERTIFICATE, minted
            # by the iotgw-ui backend's internal /ssh/ops-cert endpoint, replaces
            # the per-device KMS key (keys/id_rsa) as the SSH auth mechanism for
            # this flow (AC#4 — no more KMS-fetch-to-keys/id_rsa block). NOT
            # optional: a missing Secret fails the pod at creation
            # (CreateContainerConfigError) rather than silently having no token.
            - name: OPS_CERT_MINT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-cert-mint
                  key: OPS_CERT_MINT_TOKEN
            # task-093: non-secret host-verification context (public pki route +
            # certified FQDN). Both empty on the scheduled cron run → TOFU.
            - name: PKI_HOST_CA_ID
              value: "{{ inputs.pki_host_ca_id }}"
            - name: CERT_FQDN
              value: "{{ inputs.cert_fqdn }}"
            - name: PKI_BASE_URL
              value: "{{ inputs.pki_base_url }}"
          command:
            - /bin/bash
            - -c
            - |
              set -e
              # task-065 residual fix: clone the (public) namespace repo straight into
              # the pod's workingDir instead of injecting its files as inputFiles (see
              # Flow.yaml for the full rationale). Runs before anything else so
              # connectivity_check.yml / fetch_kms_key.py are present; inventory.yml is
              # injected via inputFiles (not in the repo) so this cannot clobber it.
              git clone --depth 1 https://github.com/i40sys/iotgw-kestra /tmp/nsrepo
              cp -a /tmp/nsrepo/. .
              rm -rf .git /tmp/nsrepo
              # task-092 part 2b: mint a short-lived iotgw-ops SSH USER CERTIFICATE
              # from the iotgw-ui backend instead of fetching a per-device key from
              # KMS — keys/id_rsa is no longer the SSH auth path (AC#4).
              # cytopia/ansible:latest-tools (Alpine) ships neither openssl nor curl.
              apk add --no-cache openssl curl
              ssh-keygen -q -t ed25519 -N '' -f /tmp/ops_key -C iotgw-ops
              ZONE='{{ inputs.json_data.pki_zone | default("") }}'
              if [ -z "$OPS_CERT_MINT_TOKEN" ]; then
                echo "ERROR: OPS_CERT_MINT_TOKEN is empty — populate the 'ops-cert-mint' Secret in the kestra namespace (task-092)." >&2
                exit 1
              fi
              if [ -n "$ZONE" ]; then
                echo "Minting a short-lived iotgw-ops SSH user certificate for zone $ZONE..."
                curl -fsS -X POST http://iotgw-ui-backend.iotgw-ui.svc.cluster.local:4444/internal/ssh/ops-cert \
                  -H "Authorization: Bearer $OPS_CERT_MINT_TOKEN" -H "Content-Type: application/json" \
                  -d "{\"zone\":\"$ZONE\",\"sshPublicKey\":\"$(cat /tmp/ops_key.pub)\"}" \
                  | python3 -c 'import sys,json;open("/tmp/ops_key-cert.pub","w").write(json.load(sys.stdin)["certificate"])'
                chmod 600 /tmp/ops_key
                echo "iotgw-ops certificate minted: $(ssh-keygen -L -f /tmp/ops_key-cert.pub | head -3)"
              else
                echo "No json_data.pki_zone provided (scheduled run or unmigrated domain) — skipping iotgw-ops cert mint; SSH will present an uncertified ephemeral key and is expected to fail authentication."
              fi
              # task-093: build the @cert-authority known_hosts so the gateway's
              # HOST certificate is verified (no TOFU). The Host CA public key comes
              # from the PUBLIC, id-addressed pki route (no auth, same as trust.sh);
              # the pattern is the exact certified FQDN, which is a principal on the
              # host cert, and the inventory pins HostKeyAlias to it.
              if [ -n "$PKI_HOST_CA_ID" ] && [ -n "$CERT_FQDN" ]; then
                echo "Fetching domain Host CA $PKI_HOST_CA_ID from $PKI_BASE_URL to verify the gateway host certificate..."
                mkdir -p keys
                # cytopia/ansible:latest-tools ships wget but NOT curl — try both.
                if command -v curl >/dev/null 2>&1; then
                  ca_pub="$(curl -fsS "$PKI_BASE_URL/ssh/cas/$PKI_HOST_CA_ID/ca.pub")"
                else
                  ca_pub="$(wget -qO- "$PKI_BASE_URL/ssh/cas/$PKI_HOST_CA_ID/ca.pub")"
                fi
                case "$ca_pub" in
                  ssh-*|ecdsa-*) : ;;
                  *) echo "pki returned no usable Host CA key for $PKI_HOST_CA_ID" >&2; exit 1 ;;
                esac
                printf '@cert-authority %s %s\n' "$CERT_FQDN" "$ca_pub" > keys/known_hosts
                chmod 600 keys/known_hosts
                echo "known_hosts written: @cert-authority $CERT_FQDN <hostCa>"
              else
                echo "No pki_host_ca_id/cert_fqdn — host verification stays TOFU (scheduled run)."
              fi
              # decision-030: ICMP reachability is checked FROM THE NETMAKER HOST
              # (the bastion) — the controller has no L3 route into the gateway
              # networks. The jump account's forced command only allows
              # `ping <IPv4>`. The result is logged as an ICMP_RESULT marker the
              # iotgw-ui backend parses; a failed ping does not stop the
              # SSH/Ansible check below (the pod's exit code is Ansible's).
              if [ -n "$ZONE" ]; then
                set +e
                ssh -i /tmp/ops_key -o CertificateFile=/tmp/ops_key-cert.pub -o IdentitiesOnly=yes \
                  -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
                  iotgw-jump@{{ kv('VPN_JUMP_HOST') }} 'ping {{ inputs.json_data.target_ip }}'
                icmp_rc=$?
                set -e
                echo "ICMP_RESULT rc=$icmp_rc"
              else
                echo "ICMP_RESULT rc=skipped (no pki_zone → no ops cert for the bastion)"
              fi
              ansible-playbook -i inventory.yml connectivity_check.yml
          workingDir: "{{ workingDir }}"
