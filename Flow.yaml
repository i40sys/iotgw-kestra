id: provisioning
namespace: iotgw-ng

inputs:
  - id: json_data
    type: JSON
    description: "The JSON input to be dumped by Ansible."
    defaults: '{"target_disk": "/dev/nvme0n1","openwrt_version": "23.05.4", "target_ip": "0.0.0.0", "ssh_key_id": "", "__tags__": []}'

tasks:
  - id: dump_input
    type: io.kestra.plugin.core.log.Log
    message:
      - "Full JSON data: {{ inputs.json_data | json }}"
      - "Tags: {{ inputs.json_data.__tags__ | default([]) | join(',') }}"

  - id: create_inventory_file
    type: io.kestra.plugin.core.debug.Return
    format: |
      all:
        children:
          openwrt:
            hosts:
              {{ inputs.json_data.target_ip }}:
        vars:
          ansible_user: 'root'
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_private_key_file: "keys/id_rsa"
          # HOST-VERIFICATION POSTURE (task-093):
          # - Gateway hop (first -o pair): TOFU today. Provisioning is where the
          #   gateway ENROLLS (ssh_ca), so its first connection is pre-certificate.
          #   Once split into pre/post-enroll steps, the POST-enroll steps should
          #   render an @cert-authority known_hosts and switch to
          #   'StrictHostKeyChecking=yes -o UserKnownHostsFile=<kh>
          #   -o GlobalKnownHostsFile=/dev/null -o HostKeyAlias=<fqdn>'
          #   (see templates/inventory.j2, and task-093 for the wiring).
          # - Bastion hop (ProxyCommand): the jump host {{ kv('VPN_JUMP_HOST') }}
          #   is NOT an iotgw-ng gateway and holds NO certificate from our Host CA,
          #   so it cannot be verified this way. ACCEPTED DECISION (task-093 AC#3):
          #   keep TOFU for the bastion, documented here; revisit by pinning its
          #   host key or issuing it a cert if the jump host ever becomes ours.
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            -o ProxyCommand="ssh -i keys/id_rsa -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            -W %h:%p -q root@{{ kv('VPN_JUMP_HOST') }}"

  - id: iotgw_deployment
    type: io.kestra.plugin.kubernetes.core.PodCreate
    # No `connection` block: uses in-cluster service account.
    # ServiceAccount `kestra` with Role `kestra-pod-runner` (deploy/k8s/base/kestra/kestra-rbac.yaml).
    # Plugin: io.kestra.plugin.kubernetes v1.9.1; connection=null → fabric8 auto-detects in-cluster.
    # k8s namespace for the runner pod: `kestra` (namespace-per-subproject split,
    # decision-020 / task-064 — the former `iotgw` namespace no longer exists).
    namespace: kestra
    metadata:
      labels:
        app.kubernetes.io/managed-by: kestra
        kestra.io/flow: provisioning
    # task-065 residual fix: injecting all 137 namespace files as individual
    # inputFiles (one exec/tar stream each into the busybox init-files
    # container) took ~9m41s on kind/WSL2 — file COUNT, not bytes, is the
    # bottleneck. Instead we inject only the tiny runtime-generated
    # inventory.yml here and `git clone` the (public) namespace repo straight
    # into the pod's workingDir in the container command below — one network
    # op instead of 137 tiny execs, and it always runs HEAD of main.
    inputFiles:
      inventory.yml: "{{ outputs.create_inventory_file.value }}"
    spec:
      restartPolicy: Never
      containers:
        - name: ansible
          image: cytopia/ansible:latest-tools
          # task-069: fetch the per-device SSH key from Cosmian KMS in-pod.
          # SSH_KEY_ID (non-secret KMIP object id) comes from the backend-packed
          # json_data.ssh_key_id; KMS_AUTH_TOKEN (task-057 bearer) is mounted
          # from the kms-auth Secret via secretKeyRef — never inlined.
          env:
            - name: SSH_KEY_ID
              value: "{{ inputs.json_data.ssh_key_id }}"
            - name: KMS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kms-auth
                  key: KMS_AUTH_TOKEN
            # SSH-CA enrollment (task-105): the anon JWT is only the Kong gateway
            # credential — the PKI fleet token lives in the ssh-ca edge function and
            # never comes near this pod. `optional: true` keeps a cluster without the
            # `supabase-anon` Secret bootable for non-ssh_ca provisions; the ssh_ca
            # path guards on it below and fails fast rather than 401-ing at Kong.
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: supabase-anon
                  key: ANON_KEY
                  optional: true
          command:
            - /bin/bash
            - -c
            - |
              set -e
              # task-065 residual fix: clone the (public) namespace repo straight into
              # the pod's workingDir instead of injecting its 137 files as inputFiles
              # (each one was a separate exec/tar stream into the init-files
              # container — ~9m41s on kind/WSL2 for file COUNT alone, not bytes).
              # This one clone always pulls HEAD of main and keeps the runner in
              # sync with the repo, per the existing sync-namespace-files pattern.
              # Runs before anything else so fetch_kms_key.py / playbooks / tasks
              # are present; inventory.yml is injected via inputFiles (not in the
              # repo) so this clone+copy cannot clobber it.
              git clone --depth 1 https://github.com/i40sys/iotgw-kestra /tmp/nsrepo
              cp -a /tmp/nsrepo/. .
              rm -rf .git /tmp/nsrepo
              pip install passlib
              mkdir -p /etc/ansible/collections /etc/ansible/roles
              ansible-galaxy collection install community.docker -p /etc/ansible/collections
              ansible-galaxy collection install community.general -p /etc/ansible/collections
              ansible-galaxy role install gekmihesg.openwrt -p /etc/ansible/roles
              cat > ansible.cfg <<'ANSIBLECFG'
              [defaults]
              roles_path = /etc/ansible/roles:~/.ansible/roles:/usr/share/ansible/roles
              collections_paths = /etc/ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
              ANSIBLECFG
              if [ -n "$SSH_KEY_ID" ]; then
                echo "Fetching device SSH key $SSH_KEY_ID from Cosmian KMS over the in-cluster FQDN..."
                python3 fetch_kms_key.py
              else
                echo "No ssh_key_id provided — skipping KMS fetch."
              fi
              chmod 600 keys/id_rsa
              # Fail fast (task-105 AC#3): when the ssh_ca path will run (full
              # playbook or an explicit ssh_ca tag) the Kong route needs the anon
              # JWT — a missing/empty supabase-anon Secret must error here, not as a
              # silent 401 deep inside enrollment.
              TAGS='{{ inputs.json_data.__tags__ | default([]) | join(",") }}'
              if [ -z "$TAGS" ] || echo ",$TAGS," | grep -q ',ssh_ca,'; then
                if [ -z "$SUPABASE_ANON_KEY" ]; then
                  echo "ERROR: ssh_ca enrollment needs SUPABASE_ANON_KEY, but it is empty — create the 'supabase-anon' Secret in the kestra namespace (task-105)." >&2
                  exit 1
                fi
              fi
              {% if inputs.json_data.__tags__ is defined and inputs.json_data.__tags__ | length > 0 %}
              ansible-playbook -i inventory.yml i11_provisioning_iotgw.yaml -e '{{ inputs.json_data | json }}' -e supabase_anon_key="$SUPABASE_ANON_KEY" --tags '{{ inputs.json_data.__tags__ | join(",") }}'
              {% else %}
              ansible-playbook -i inventory.yml i11_provisioning_iotgw.yaml -e '{{ inputs.json_data | json }}' -e supabase_anon_key="$SUPABASE_ANON_KEY"
              {% endif %}
          workingDir: "{{ workingDir }}"
