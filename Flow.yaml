id: provisioning
namespace: iotgw-ng

inputs:
  - id: json_data
    type: JSON
    description: "The JSON input to be dumped by Ansible."
    defaults: '{"target_disk": "/dev/nvme0n1","openwrt_version": "23.05.4", "target_ip": "0.0.0.0", "ssh_key_id": "", "__tags__": []}'

tasks:
  - id: dump_input
    type: io.kestra.plugin.core.log.Log
    message:
      - "Full JSON data: {{ inputs.json_data | json }}"
      - "Tags: {{ inputs.json_data.__tags__ | default([]) | join(',') }}"

  - id: create_inventory_file
    type: io.kestra.plugin.core.debug.Return
    format: |
      all:
        children:
          openwrt:
            hosts:
              {{ inputs.json_data.target_ip }}:
        vars:
          ansible_user: 'root'
          ansible_python_interpreter: /usr/bin/python3
          # task-092 part 2b: the short-lived iotgw-ops USER CERTIFICATE minted
          # in-pod (see the command block below) replaces the per-device KMS key
          # (keys/id_rsa) as the SSH credential for BOTH hops below.
          # CertificateFile is set explicitly even though ssh auto-loads a
          # same-named "-cert.pub" next to the private key, for clarity.
          ansible_ssh_private_key_file: "/tmp/ops_key"
          # HOST-VERIFICATION POSTURE (task-093):
          # - Gateway hop (first -o pair): TOFU today. Provisioning is where the
          #   gateway ENROLLS (ssh_ca), so its first connection is pre-certificate.
          #   Once split into pre/post-enroll steps, the POST-enroll steps should
          #   render an @cert-authority known_hosts and switch to
          #   'StrictHostKeyChecking=yes -o UserKnownHostsFile=<kh>
          #   -o GlobalKnownHostsFile=/dev/null -o HostKeyAlias=<fqdn>'
          #   (see templates/inventory.j2, and task-093 for the wiring).
          # - Bastion hop (ProxyCommand): the jump host {{ kv('VPN_JUMP_HOST') }}
          #   is NOT an iotgw-ng gateway and holds NO certificate from our Host CA,
          #   so it cannot be verified this way. ACCEPTED DECISION (task-093 AC#3):
          #   keep TOFU for the bastion, documented here; revisit by pinning its
          #   host key or issuing it a cert if the jump host ever becomes ours.
          # - USER-cert trust (task-092): the SAME cert authenticates both hops
          #   ONLY once the bastion trusts the domain's User CA
          #   (TrustedUserCAKeys) — a documented OPERATOR step on the bastion's
          #   sshd config, NOT configured by this flow.
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            -o CertificateFile=/tmp/ops_key-cert.pub
            -o ProxyCommand="ssh -i /tmp/ops_key -o CertificateFile=/tmp/ops_key-cert.pub
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            -W %h:%p -q iotgw-jump@{{ kv('VPN_JUMP_HOST') }}"

  - id: iotgw_deployment
    type: io.kestra.plugin.kubernetes.core.PodCreate
    # No `connection` block: uses in-cluster service account.
    # ServiceAccount `kestra` with Role `kestra-pod-runner` (deploy/k8s/base/kestra/kestra-rbac.yaml).
    # Plugin: io.kestra.plugin.kubernetes v1.9.1; connection=null → fabric8 auto-detects in-cluster.
    # k8s namespace for the runner pod: `kestra` (namespace-per-subproject split,
    # decision-020 / task-064 — the former `iotgw` namespace no longer exists).
    namespace: kestra
    metadata:
      labels:
        app.kubernetes.io/managed-by: kestra
        kestra.io/flow: provisioning
    # task-065 residual fix: injecting all 137 namespace files as individual
    # inputFiles (one exec/tar stream each into the busybox init-files
    # container) took ~9m41s on kind/WSL2 — file COUNT, not bytes, is the
    # bottleneck. Instead we inject only the tiny runtime-generated
    # inventory.yml here and `git clone` the (public) namespace repo straight
    # into the pod's workingDir in the container command below — one network
    # op instead of 137 tiny execs, and it always runs HEAD of main.
    inputFiles:
      inventory.yml: "{{ outputs.create_inventory_file.value }}"
    spec:
      restartPolicy: Never
      containers:
        - name: ansible
          # PINNED (iotgw-ng task-129): ansible-core 2.18.19 + community.general
          # 10.7.6 + community.docker 4.8.5 bundled. `latest-tools` silently moved
          # to ansible-core 2.21, which breaks the gekmihesg.openwrt role (its
          # monkeypatch needs the pre-2.19 _configure_module 4-tuple). Bump the
          # tag AND digest together, and re-test provisioning.
          image: cytopia/ansible:2.18-tools@sha256:da5e5a6066afb11ef1541a7eff690ec28a1af9647c4f04533f71d3f7fcd1affe
          env:
            # task-092 part 2b: short-lived iotgw-ops SSH USER CERTIFICATE, minted
            # by the iotgw-ui backend's internal /ssh/ops-cert endpoint, replaces
            # the per-device KMS key (keys/id_rsa) as the SSH auth mechanism for
            # this flow (AC#4 — no more KMS-fetch-to-keys/id_rsa block). NOT
            # optional: a missing Secret fails the pod at creation
            # (CreateContainerConfigError) rather than silently having no token.
            - name: OPS_CERT_MINT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-cert-mint
                  key: OPS_CERT_MINT_TOKEN
            # SSH-CA enrollment (task-105): the anon JWT is only the Kong gateway
            # credential — the PKI fleet token lives in the ssh-ca edge function and
            # never comes near this pod. `optional: true` keeps a cluster without the
            # `supabase-anon` Secret bootable for non-ssh_ca provisions; the ssh_ca
            # path guards on it below and fails fast rather than 401-ing at Kong.
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: supabase-anon
                  key: ANON_KEY
                  optional: true
          command:
            - /bin/bash
            - -c
            - |
              set -e
              # task-065 residual fix: clone the (public) namespace repo straight into
              # the pod's workingDir instead of injecting its 137 files as inputFiles
              # (each one was a separate exec/tar stream into the init-files
              # container — ~9m41s on kind/WSL2 for file COUNT alone, not bytes).
              # This one clone always pulls HEAD of main and keeps the runner in
              # sync with the repo, per the existing sync-namespace-files pattern.
              # Runs before anything else so fetch_kms_key.py / playbooks / tasks
              # are present; inventory.yml is injected via inputFiles (not in the
              # repo) so this clone+copy cannot clobber it.
              git clone --depth 1 https://github.com/i40sys/iotgw-kestra /tmp/nsrepo
              cp -a /tmp/nsrepo/. .
              rm -rf .git /tmp/nsrepo
              # SSH-CA enrollment (tasks/ssh_ca.yaml) encrypts the TOTP envelope and
              # POSTs it to the ssh-ca edge function from the CONTROLLER (delegate_to
              # localhost = this pod). cytopia/ansible:2.18-tools (Alpine) ships
              # neither openssl nor curl, so add them before the playbook runs.
              apk add --no-cache openssl curl
              pip install passlib
              mkdir -p /etc/ansible/collections /etc/ansible/roles
              ansible-galaxy collection install community.docker -p /etc/ansible/collections
              ansible-galaxy collection install community.general -p /etc/ansible/collections
              ansible-galaxy role install git+https://github.com/gekmihesg/ansible-openwrt.git,01fda612aeedd0b6578aaede330c28a47fca3013,gekmihesg.openwrt -p /etc/ansible/roles
              cat > ansible.cfg <<'ANSIBLECFG'
              [defaults]
              roles_path = /etc/ansible/roles:~/.ansible/roles:/usr/share/ansible/roles
              collections_paths = /etc/ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
              ANSIBLECFG
              # task-092 part 2b: mint a short-lived iotgw-ops SSH USER CERTIFICATE
              # from the iotgw-ui backend instead of fetching a per-device key from
              # KMS — keys/id_rsa is no longer the SSH auth path (AC#4). The
              # backend packs the domain's pki-manager zone into
              # json_data.pki_zone. OPS_CERT_MINT_TOKEN itself is guaranteed
              # present (non-optional secretKeyRef above); an empty pki_zone
              # (domain not yet migrated, or the scheduled/no-identity path on
              # other flows) is NOT a hard failure here — we skip the mint and
              # let the SSH step fail naturally on the uncertified ephemeral key,
              # same "no personal-key fallback" outcome, just surfaced at the
              # ansible layer instead of bash.
              ssh-keygen -q -t ed25519 -N '' -f /tmp/ops_key -C iotgw-ops
              ZONE='{{ inputs.json_data.pki_zone | default("") }}'
              if [ -z "$OPS_CERT_MINT_TOKEN" ]; then
                echo "ERROR: OPS_CERT_MINT_TOKEN is empty — populate the 'ops-cert-mint' Secret in the kestra namespace (task-092)." >&2
                exit 1
              fi
              if [ -n "$ZONE" ]; then
                echo "Minting a short-lived iotgw-ops SSH user certificate for zone $ZONE..."
                curl -fsS -X POST http://iotgw-ui-backend.iotgw-ui.svc.cluster.local:4444/internal/ssh/ops-cert \
                  -H "Authorization: Bearer $OPS_CERT_MINT_TOKEN" -H "Content-Type: application/json" \
                  -d "{\"zone\":\"$ZONE\",\"sshPublicKey\":\"$(cat /tmp/ops_key.pub)\"}" \
                  | python3 -c 'import sys,json;open("/tmp/ops_key-cert.pub","w").write(json.load(sys.stdin)["certificate"])'
                chmod 600 /tmp/ops_key
                echo "iotgw-ops certificate minted: $(ssh-keygen -L -f /tmp/ops_key-cert.pub | head -3)"
              else
                echo "No json_data.pki_zone provided — skipping iotgw-ops cert mint; SSH will present an uncertified ephemeral key and is expected to fail authentication."
              fi
              # Fail fast (task-105 AC#3): when the ssh_ca path will run (full
              # playbook or an explicit ssh_ca tag) the Kong route needs the anon
              # JWT — a missing/empty supabase-anon Secret must error here, not as a
              # silent 401 deep inside enrollment.
              TAGS='{{ inputs.json_data.__tags__ | default([]) | join(",") }}'
              if [ -z "$TAGS" ] || echo ",$TAGS," | grep -q ',ssh_ca,'; then
                if [ -z "$SUPABASE_ANON_KEY" ]; then
                  echo "ERROR: ssh_ca enrollment needs SUPABASE_ANON_KEY, but it is empty — create the 'supabase-anon' Secret in the kestra namespace (task-105)." >&2
                  exit 1
                fi
              fi
              {% if inputs.json_data.__tags__ is defined and inputs.json_data.__tags__ | length > 0 %}
              ansible-playbook -i inventory.yml i11_provisioning_iotgw.yaml -e '{{ inputs.json_data | json }}' -e supabase_anon_key="$SUPABASE_ANON_KEY" --tags '{{ inputs.json_data.__tags__ | join(",") }}'
              {% else %}
              ansible-playbook -i inventory.yml i11_provisioning_iotgw.yaml -e '{{ inputs.json_data | json }}' -e supabase_anon_key="$SUPABASE_ANON_KEY"
              {% endif %}
          workingDir: "{{ workingDir }}"
