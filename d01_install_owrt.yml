---
- name: Installing OpenWRT
  hosts: all
  remote_user: root
  gather_facts: false
  vars:
    target_disk: /dev/sda
    openwrt_version: 23.05.4
    vpn_server_ip: 1.2.3.4
    vpn_server_port: 123
    vpn_private_key: the_private_key
    vpn_public_key: the_public_key
    vpn_ip_address: 4.3.2.1
    ip_route_default_gw: 2.1.3.4

  tasks:
    - import_tasks: tasks/partitions.yaml
      tags: partitions

    - name: Copy file copying script to the remote host
      ansible.builtin.copy:
        src: copy_files.sh
        dest: /tmp/copy_files.sh
        mode: "0755"

    - name: Downloading OpenWRT {{ openwrt_version }} and copying files to the disk {{ target_disk }}
      ansible.builtin.command:
        cmd: /tmp/copy_files.sh "{{ target_disk }}" "{{ openwrt_version }}"

    - name: Copy GRUB configuration script to the remote host
      ansible.builtin.copy:
        src: grub_config.sh
        dest: /tmp/grub_config.sh
        mode: "0755"

    - name: Execute GRUB configuration script at {{ target_disk }}
      ansible.builtin.command:
        cmd: /tmp/grub_config.sh "{{ target_disk }}"
    
    - name: Copy script for setting up chroot
      ansible.builtin.copy:
        src: chroot.sh
        dest: /tmp/chroot.sh
        mode: "0755"

    - name: Execute script for setting up chroot
      ansible.builtin.command:
        cmd: /tmp/chroot.sh "{{ target_disk }}"

    - name: Copy GRUB installation script to the remote host
      ansible.builtin.copy:
        src: grub_install.sh
        dest: /tmp/grub_install.sh
        mode: "0755"

    - name: Execute GRUB installation script to {{ target_disk }}
      ansible.builtin.command:
        cmd: /tmp/grub_install.sh "{{ target_disk }}"

    - name: Copy script for setting /etc/config/fstab
      ansible.builtin.copy:
        src: setup_fstab.sh
        dest: /tmp/setup_fstab.sh
        mode: "0755"

    - name: Execute script for setting /etc/config/fstab
      ansible.builtin.command:
        cmd: /tmp/setup_fstab.sh "{{ target_disk }}"

    - name: Copy script for enabling Ansible for OpenWRT
      ansible.builtin.copy:
        src: enable_ansible.sh
        dest: /tmp/enable_ansible.sh
        mode: "0755"

    - name: Ship the vendored break-glass authorized_keys (task-091, no public-internet fetch)
      ansible.builtin.copy:
        src: authorized_keys
        dest: /tmp/authorized_keys
        mode: "0644"

    - name: Enabling Ansible for OpenWRT script
      ansible.builtin.command:
        cmd: /tmp/enable_ansible.sh

    - name: Allow everything in firewall zones
      ansible.builtin.template:
        src: templates/firewall_default.j2
        dest: /mnt/p2/etc/config/firewall
        owner: root
        group: root
        mode: '0644'

    - name: Copy script for setting up VPN
      ansible.builtin.copy:
        src: setup_vpn.sh
        dest: /tmp/setup_vpn.sh
        mode: "0755"
      tags: [vpn]

    # setup_vpn.sh parses an existing /etc/wireguard/wg0.conf on the live host;
    # skip with `--skip-tags vpn` for a bare canary/SSH-CA test that has none.
    - name: Set up VPN
      ansible.builtin.command:
        cmd: /tmp/setup_vpn.sh
      tags: [vpn]

    - name: Copy script for unsetting up chroot
      ansible.builtin.copy:
        src: unchroot.sh
        dest: /tmp/unchroot.sh
        mode: "0755"

    - name: Execute script for unsetting up chroot
      ansible.builtin.command:
        cmd: /tmp/unchroot.sh "{{ target_disk }}"

    - name: Everything done.
      ansible.builtin.debug:
        msg: "Reboot the target machine and boot with hard drive."
